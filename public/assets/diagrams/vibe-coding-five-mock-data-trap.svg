<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto">
  <defs>
    <linearGradient id="trap-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="20" fill="url(#trap-bg)"/>
  <rect width="958" height="478" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Top Title Banner -->
  <g transform="translate(480, 38)">
    <text text-anchor="middle" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">THE 5-MOCK-DATA ILLUSION</text>
    <text text-anchor="middle" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="22" font-weight="900">五筆假資料的甜蜜幻覺 vs 五百筆真實資料的慘劇</text>
  </g>

  <!-- Left Side: 5 Mock Data (Sweet Illusion) -->
  <g transform="translate(50, 95)">
    <rect width="405" height="345" rx="16" fill="rgba(16,185,129,0.05)" stroke="#10B981" stroke-width="1.5"/>
    
    <g transform="translate(20, 20)">
      <rect width="210" height="28" rx="14" fill="rgba(16,185,129,0.2)"/>
      <text x="105" y="19" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">5 筆假資料（本機開發超順）</text>
    </g>

    <g transform="translate(202, 110)">
      <circle cx="0" cy="0" r="42" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
      <text x="0" y="8" fill="#34D399" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle">5 筆</text>
    </g>

    <!-- Formula Box -->
    <rect x="50" y="175" width="305" height="75" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="202" y="202" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">雙重巢狀迴圈 O(N²) 運算量：</text>
    <text x="202" y="232" fill="#34D399" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="middle">5 × 5 = 僅 25 次計算</text>

    <text x="202" y="285" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      ✨ 耗時 0.001 秒！肉眼完全感覺不到任何延遲
    </text>
    <text x="202" y="315" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">
      讓你誤以為 AI 寫出了「完美高效率代碼」
    </text>
  </g>

  <!-- Right Side: 500 Real Data (Reality Crash) -->
  <g transform="translate(505, 95)">
    <rect width="405" height="345" rx="16" fill="rgba(244,63,94,0.06)" stroke="#F43F5E" stroke-width="2" stroke-dasharray="6 3"/>
    
    <g transform="translate(20, 20)">
      <rect width="210" height="28" rx="14" fill="rgba(244,63,94,0.2)"/>
      <text x="105" y="19" fill="#FDA4AF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">500 筆真實資料（上線當場卡死）</text>
    </g>

    <g transform="translate(202, 110)">
      <circle cx="0" cy="0" r="42" fill="#881337" stroke="#F43F5E" stroke-width="2"/>
      <text x="0" y="8" fill="#FECDD3" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" text-anchor="middle">500 筆</text>
    </g>

    <!-- Formula Box -->
    <rect x="50" y="175" width="305" height="75" rx="10" fill="#1E293B" stroke="#881337"/>
    <text x="202" y="202" fill="#FDA4AF" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">同一段代碼，運算量爆炸 10,000 倍：</text>
    <text x="202" y="232" fill="#F43F5E" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle">500 × 500 = 250,000 次！</text>

    <text x="202" y="285" fill="#F87171" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      💥 手機發燙、記憶體暴衝、畫面凍結 6 秒！
    </text>
    <text x="202" y="315" fill="#FECDD3" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">
      這就是為什麼「上線前必須做千筆假資料壓力測試」！
    </text>
  </g>
</svg>
