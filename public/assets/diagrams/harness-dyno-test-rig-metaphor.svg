<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto">
  <defs>
    <linearGradient id="dyno-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="20" fill="url(#dyno-bg)"/>
  <rect width="958" height="478" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Top Title Banner -->
  <g transform="translate(480, 38)">
    <text text-anchor="middle" fill="#818CF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">AUTOMATED TEST RIG VS HIGHWAY BREAKDOWN</text>
    <text text-anchor="middle" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="22" font-weight="900">工程學的試車台隱喻：直接開上路拋錨 vs 室內測功機自動除錯</text>
  </g>

  <!-- Left: Direct to Highway (Breakdown) -->
  <g transform="translate(60, 95)">
    <rect width="400" height="340" rx="16" fill="rgba(239,68,68,0.05)" stroke="#EF4444" stroke-width="2"/>
    <rect width="400" height="8" rx="4" fill="#EF4444"/>

    <!-- Title Badge -->
    <g transform="translate(20, 20)">
      <rect width="200" height="26" rx="13" fill="rgba(239,68,68,0.2)"/>
      <text x="100" y="18" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">❌ 沒有試車台：肉眼盲目上路</text>
    </g>

    <!-- Visual Metaphor: Broken car on road -->
    <g transform="translate(25, 60)">
      <!-- Road -->
      <line x1="0" y1="180" x2="350" y2="180" stroke="#64748B" stroke-width="3"/>
      <line x1="0" y1="180" x2="350" y2="180" stroke="#F59E0B" stroke-width="2" stroke-dasharray="10 10"/>

      <!-- Broken car chassis -->
      <rect x="70" y="120" width="160" height="45" rx="8" fill="#475569" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="105" cy="165" r="14" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="195" cy="165" r="14" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>

      <!-- Smoke puff -->
      <circle cx="85" cy="100" r="16" fill="rgba(239,68,68,0.4)"/>
      <circle cx="75" cy="80" r="22" fill="rgba(239,68,68,0.3)"/>
      <text x="75" y="86" text-anchor="middle" font-size="14">🔥</text>

      <!-- Panic alert box -->
      <rect x="180" y="40" width="160" height="60" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
      <text x="260" y="65" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">線上壞掉！慘叫除錯</text>
      <text x="260" y="85" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">使用者狂報錯，手忙腳亂</text>
    </g>

    <!-- Description -->
    <g transform="translate(25, 260)">
      <text y="0" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">💥 痛點：人工點擊測試又累又漏</text>
      <text y="22" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">• 每次寫完都要打開網頁亂點幾十個按鈕</text>
      <text y="42" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">• 改了 A 頁面，不知道 B 頁面早就爆發 404</text>
    </g>
  </g>

  <!-- Right: Indoor Test Rig (Automated Dyno Harness) -->
  <g transform="translate(500, 95)">
    <rect width="400" height="340" rx="16" fill="rgba(99,102,241,0.05)" stroke="#6366F1" stroke-width="2"/>
    <rect width="400" height="8" rx="4" fill="#6366F1"/>

    <!-- Title Badge -->
    <g transform="translate(20, 20)">
      <rect width="210" height="26" rx="13" fill="rgba(99,102,241,0.2)"/>
      <text x="105" y="18" fill="#C7D2FE" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">✅ 有自動試車台：工廠室內狂測</text>
    </g>

    <!-- Visual Metaphor: Engine on Test Bench -->
    <g transform="translate(25, 60)">
      <!-- Test Rig Cage -->
      <rect x="50" y="40" width="250" height="135" rx="10" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 4"/>

      <!-- Engine unit clamped on rig -->
      <rect x="100" y="65" width="150" height="85" rx="8" fill="#312E81" stroke="#A5B4FC" stroke-width="2"/>
      <circle cx="175" cy="100" r="20" fill="#4338CA"/>
      <text x="175" y="106" text-anchor="middle" font-size="14">⚙️</text>

      <!-- Sensors and gauges -->
      <rect x="12" y="70" width="70" height="28" rx="6" fill="#1E293B" stroke="#10B981"/>
      <text x="47" y="87" fill="#34D399" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">404: 0 ✓</text>

      <rect x="12" y="110" width="70" height="28" rx="6" fill="#1E293B" stroke="#10B981"/>
      <text x="47" y="127" fill="#34D399" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">Build: PASS</text>

      <rect x="268" y="70" width="70" height="28" rx="6" fill="#1E293B" stroke="#38BDF8"/>
      <text x="303" y="87" fill="#38BDF8" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">Lint: OK</text>

      <rect x="268" y="110" width="70" height="28" rx="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="303" y="127" fill="#FDE68A" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">Size: OK</text>
    </g>

    <!-- Description -->
    <g transform="translate(25, 260)">
      <text y="0" fill="#A5B4FC" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">🏆 優勢：AI 寫完自己跑考卷，完全不煩你</text>
      <text y="22" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5">• 一鍵觸發自動測試，3 秒內掃蕩全站所有潛在崩潰</text>
      <text y="42" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5">• 測試合格才出廠，發布上線永遠 100% 放心</text>
    </g>
  </g>
</svg>
