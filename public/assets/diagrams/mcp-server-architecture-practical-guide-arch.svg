<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="auto">
  <defs>
    <linearGradient id="mcp-arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="960" height="620" rx="20" fill="url(#mcp-arch-bg)"/>
  <rect width="958" height="618" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(480, 38)">
    <text text-anchor="middle" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">MODEL CONTEXT PROTOCOL · 3-LAYER ARCHITECTURE</text>
    <text text-anchor="middle" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="22" font-weight="900">MCP Host / Client / Server 三層協議與安全邊界架構</text>
  </g>

  <!-- Column 1: MCP Host & Client -->
  <g transform="translate(36, 95)">
    <rect width="270" height="420" rx="16" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <rect width="270" height="8" rx="4" fill="#3B82F6"/>

    <text x="135" y="38" text-anchor="middle" fill="#93C5FD" font-family="-apple-system, sans-serif" font-size="15" font-weight="800">1. MCP Host（宿主環境）</text>
    <text x="135" y="57" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">Claude Desktop / Cursor / IDE</text>

    <rect x="20" y="75" width="230" height="68" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="135" y="98" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700">🧠 LLM 推理引擎</text>
    <text x="135" y="118" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">決定何時調用工具與組裝參數</text>

    <rect x="20" y="160" width="230" height="110" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="135" y="184" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">🔌 MCP Client（1 對 1 連線）</text>
    <text x="32" y="208" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">• initialize 能力協商 (Handshake)</text>
    <text x="32" y="228" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">• 維護 JSON-RPC 2.0 Session</text>
    <text x="32" y="248" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">• 觸發人機確認 (HITL 審批)</text>

    <rect x="20" y="288" width="230" height="110" rx="10" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1"/>
    <text x="135" y="312" text-anchor="middle" fill="#FCD34D" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">⚙️ 設定檔掛載點</text>
    <text x="32" y="335" fill="#FDE68A" font-family="monospace" font-size="10.5">.cursor/mcp.json</text>
    <text x="32" y="355" fill="#FDE68A" font-family="monospace" font-size="10.5">claude_desktop_config.json</text>
    <text x="32" y="378" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">嚴禁透過 stdout 輸出 Debug 字串</text>
  </g>

  <!-- Transport Pipe -->
  <g transform="translate(314, 210)">
    <line x1="0" y1="45" x2="72" y2="45" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
    <line x1="72" y1="85" x2="0" y2="85" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <rect x="-4" y="105" width="80" height="62" rx="8" fill="#0F172A" stroke="#38BDF8"/>
    <text x="36" y="125" text-anchor="middle" fill="#7DD3FC" font-family="monospace" font-size="10" font-weight="700">Transport</text>
    <text x="36" y="142" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="9.5">stdio</text>
    <text x="36" y="157" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">HTTP/SSE</text>
  </g>

  <!-- Column 2: MCP Server Capabilities -->
  <g transform="translate(394, 95)">
    <rect width="275" height="420" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <rect width="275" height="8" rx="4" fill="#10B981"/>

    <text x="137" y="38" text-anchor="middle" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="15" font-weight="800">2. MCP Server（能力暴露層）</text>
    <text x="137" y="57" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">@modelcontextprotocol/sdk</text>

    <!-- Tools -->
    <rect x="18" y="75" width="239" height="92" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="30" y="97" fill="#34D399" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800">🛠️ Tools（模型控制 · 動作執行）</text>
    <text x="30" y="117" fill="#CBD5E1" font-family="monospace" font-size="10.5">query_readonly_sql(sql, params)</text>
    <text x="30" y="136" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">Zod Schema 強型別驗證 + LIMIT 鎖定</text>
    <text x="30" y="153" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="10">Model-controlled · 需審核寫入風險</text>

    <!-- Resources -->
    <rect x="18" y="180" width="239" height="92" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="30" y="202" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800">📄 Resources（應用控制 · 唯讀上下文）</text>
    <text x="30" y="222" fill="#CBD5E1" font-family="monospace" font-size="10.5">db://schema/tables/{name}</text>
    <text x="30" y="241" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">主動暴露資料表結構與關聯文件</text>
    <text x="30" y="258" fill="#7DD3FC" font-family="-apple-system, sans-serif" font-size="10">Application-controlled · 類似 GET</text>

    <!-- Prompts -->
    <rect x="18" y="285" width="239" height="113" rx="10" fill="#0F172A" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="30" y="307" fill="#C4B5FD" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800">💬 Prompts（使用者觸發 · 範本）</text>
    <text x="30" y="327" fill="#CBD5E1" font-family="monospace" font-size="10.5">/analyze-slow-orders</text>
    <text x="30" y="346" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">封裝團隊標準分析指令與安全查詢</text>
    <text x="30" y="365" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">日誌一律走 process.stderr.write()</text>
    <text x="30" y="384" fill="#DDD6FE" font-family="-apple-system, sans-serif" font-size="10">User-controlled · Slash Command</text>
  </g>

  <!-- Security Gate Arrow -->
  <g transform="translate(675, 225)">
    <line x1="0" y1="30" x2="54" y2="30" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
    <rect x="-2" y="48" width="58" height="44" rx="8" fill="#451A03" stroke="#F59E0B"/>
    <text x="27" y="67" text-anchor="middle" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">安全</text>
    <text x="27" y="82" text-anchor="middle" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">邊界</text>
  </g>

  <!-- Column 3: Security Sandbox & Data Layer -->
  <g transform="translate(734, 95)">
    <rect width="190" height="420" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <rect width="190" height="8" rx="4" fill="#F59E0B"/>

    <text x="95" y="38" text-anchor="middle" fill="#FCD34D" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="800">3. 安全邊界與資料層</text>
    <text x="95" y="57" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Defense-in-Depth</text>

    <rect x="14" y="75" width="162" height="100" rx="10" fill="#450A0A" stroke="#EF4444"/>
    <text x="95" y="98" text-anchor="middle" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">🛑 SQL &amp; 路徑防禦</text>
    <text x="24" y="120" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="10.5">• 封鎖 DROP/DELETE/ATTACH</text>
    <text x="24" y="139" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="10.5">• 強制單一 SELECT 語句</text>
    <text x="24" y="158" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="10.5">• path.resolve 白名單防穿越</text>

    <rect x="14" y="192" width="162" height="100" rx="10" fill="#064E3B" stroke="#10B981"/>
    <text x="95" y="215" text-anchor="middle" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">🗄️ 唯讀連線執行</text>
    <text x="24" y="237" fill="#A7F3D0" font-family="monospace" font-size="10">readonly: true</text>
    <text x="24" y="256" fill="#A7F3D0" font-family="monospace" font-size="10">BEGIN READ ONLY</text>
    <text x="24" y="275" fill="#A7F3D0" font-family="monospace" font-size="10">timeout: 5000ms</text>

    <rect x="14" y="308" width="162" height="90" rx="10" fill="#0F172A" stroke="#475569"/>
    <text x="95" y="331" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">📊 脫敏回傳</text>
    <text x="24" y="353" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">• 遮罩個資欄位 (PII)</text>
    <text x="24" y="372" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">• 上限 100 筆防爆 Token</text>
  </g>

  <!-- Bottom Protocol Flow Strip -->
  <g transform="translate(36, 535)">
    <rect width="888" height="58" rx="12" fill="rgba(15,23,42,0.9)" stroke="#334155" stroke-width="1.5"/>
    <text x="444" y="24" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800">
      完整調用時序：Host 啟動時 initialize 握手 ➔ 探索 tools/list &amp; resources/list ➔ LLM 呼叫 tools/call ➔ 安全沙盒驗證回傳 JSON
    </text>
    <text x="444" y="45" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">
      寫一次 MCP Server，同時相容 Claude Desktop、Cursor、Windsurf、Claude Code 與自建 Agent Runtime
    </text>
  </g>
</svg>
