<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto">
  <defs>
    <linearGradient id="arch06-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <marker id="arrow06-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow06-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow06-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="20" fill="url(#arch06-bg)"/>
  <rect width="958" height="518" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(480, 36)">
    <text text-anchor="middle" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">IDENTITY-STATE SEPARATION &amp; IMG2VID CHAINING</text>
    <text text-anchor="middle" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="21" font-weight="900">AI 影視連戲工程架構：角色錨點 × 動態 World State × 尾幀接首幀管線</text>
  </g>

  <!-- Left Top: Immutable Character Anchor -->
  <g transform="translate(32, 86)">
    <rect width="265" height="175" rx="14" fill="rgba(56,189,248,0.08)" stroke="#38BDF8" stroke-width="1.6"/>
    <text x="18" y="28" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">1. 不可變角色錨點 (Immutable ID)</text>
    <rect x="16" y="42" width="233" height="116" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="28" y="64" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">• 基準三視圖 (Turnaround Sheet)</text>
    <text x="36" y="82" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">正面 / 側面 90° / 45° 半側面</text>
    <text x="28" y="104" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">• 五官與服裝骨架特徵鎖死</text>
    <text x="36" y="122" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">無關天氣/傷痕的純淨基準外觀</text>
    <text x="28" y="144" fill="#7DD3FC" font-family="monospace" font-size="10">char_id: "hero_lin_v2"</text>
  </g>

  <!-- Left Bottom: Mutable World State JSON -->
  <g transform="translate(32, 278)">
    <rect width="265" height="205" rx="14" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.6"/>
    <text x="18" y="28" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">2. 動態世界狀態 (World State)</text>
    <rect x="16" y="42" width="233" height="146" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="28" y="64" fill="#FDE68A" font-family="monospace" font-size="10.5">"shot_id": "S04_C02",</text>
    <text x="28" y="84" fill="#E2E8F0" font-family="monospace" font-size="10.5">"wardrobe_wetness": 0.8,</text>
    <text x="28" y="104" fill="#E2E8F0" font-family="monospace" font-size="10.5">"injury": "left_cheek_cut",</text>
    <text x="28" y="124" fill="#E2E8F0" font-family="monospace" font-size="10.5">"held_prop": "umbrella_R",</text>
    <text x="28" y="144" fill="#E2E8F0" font-family="monospace" font-size="10.5">"key_light": "45deg_back_L",</text>
    <text x="28" y="164" fill="#34D399" font-family="monospace" font-size="10.5">"axis_side": "camera_south"</text>
  </g>

  <!-- Arrows into Compiler -->
  <line x1="298" y1="173" x2="346" y2="235" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow06-cyan)"/>
  <line x1="298" y1="380" x2="346" y2="310" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow06-amber)"/>

  <!-- Center: GEO Blocking + Shot Compiler -->
  <g transform="translate(354, 86)">
    <rect width="276" height="397" rx="16" fill="rgba(167,139,250,0.09)" stroke="#A78BFA" stroke-width="1.8"/>
    <rect width="276" height="8" rx="4" fill="#A78BFA"/>

    <text x="138" y="34" fill="#DDD6FE" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">3. GEO Blocking &amp; 鏡頭編譯器</text>
    <text x="138" y="53" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">Shot Prompt + Spatial Lock Compiler</text>

    <!-- 180 Axis Box -->
    <rect x="16" y="70" width="244" height="145" rx="10" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.3"/>
    <text x="138" y="92" fill="#C4B5FD" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">📐 180° 越軸防呆 (Action Axis)</text>
    <line x1="36" y1="138" x2="240" y2="138" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="70" cy="138" r="9" fill="#38BDF8"/>
    <circle cx="206" cy="138" r="9" fill="#EC4899"/>
    <text x="70" y="122" fill="#7DD3FC" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">角色 A (左)</text>
    <text x="206" y="122" fill="#F9A8D4" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">角色 B (右)</text>
    <path d="M 55 182 Q 138 206 221 182" fill="none" stroke="#10B981" stroke-width="2"/>
    <circle cx="96" cy="188" r="6" fill="#10B981"/>
    <circle cx="180" cy="188" r="6" fill="#10B981"/>
    <text x="138" y="175" fill="#34D399" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">合法機位半圓區 (Cam 1 / Cam 2)</text>

    <!-- Shutter & Optics Spec -->
    <rect x="16" y="230" width="244" height="150" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="28" y="254" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800">🎥 物理攝影與快門參數注入</text>
    <text x="28" y="276" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">• 焦段鎖定：35mm / 50mm / 85mm</text>
    <text x="28" y="296" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">• 180° Shutter Rule：24fps + 1/48s</text>
    <text x="28" y="316" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">  維持電影級自然 Motion Blur</text>
    <text x="28" y="338" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">• 視線方向：facing screen-right</text>
    <text x="28" y="362" fill="#34D399" font-family="monospace" font-size="10" font-weight="700">Output: Keyframe + Motion Prompt</text>
  </g>

  <!-- Arrow Compiler -> Video Chaining -->
  <line x1="632" y1="284" x2="672" y2="284" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#arrow06-purple)"/>

  <!-- Right: Last-Frame-to-First-Frame Img2Vid Chaining -->
  <g transform="translate(680, 86)">
    <rect width="248" height="397" rx="16" fill="rgba(16,185,129,0.08)" stroke="#10B981" stroke-width="1.8"/>
    <rect width="248" height="8" rx="4" fill="#10B981"/>

    <text x="124" y="34" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">4. Img2Vid 尾幀接首幀串流</text>
    <text x="124" y="53" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">Kling / Runway / Sora / Wan 2.1</text>

    <!-- Shot 1 -->
    <rect x="16" y="72" width="216" height="72" rx="10" fill="#0F172A" stroke="#38BDF8"/>
    <text x="28" y="94" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800">Shot 01 (Anchor Keyframe)</text>
    <text x="28" y="114" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">生成 5 秒影片 → 抽取最後一幀</text>
    <text x="28" y="132" fill="#FDE68A" font-family="monospace" font-size="10">Extract: S01_last_frame.png</text>

    <line x1="124" y1="146" x2="124" y2="174" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow06-amber)"/>

    <!-- Drift Repair Gate -->
    <rect x="16" y="180" width="216" height="82" rx="10" fill="#1E293B" stroke="#F59E0B"/>
    <text x="124" y="202" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">🛠️ 畫質與狀態校正閘門</text>
    <text x="28" y="222" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10">• 針對尾幀做局部 Inpaint 補傷口</text>
    <text x="28" y="240" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10">• 清除第 2 代壓縮糊化 (De-drift)</text>

    <line x1="124" y1="264" x2="124" y2="292" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow06-amber)"/>

    <!-- Shot 2 -->
    <rect x="16" y="298" width="216" height="82" rx="10" fill="#064E3B" stroke="#34D399"/>
    <text x="28" y="320" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800">Shot 02 (Img2Vid 接續)</text>
    <text x="28" y="340" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="10.5">以校正後首幀 + 新運鏡指令驅動</text>
    <text x="28" y="358" fill="#34D399" font-family="monospace" font-size="10">並同步更新 World State JSON</text>
  </g>
</svg>
