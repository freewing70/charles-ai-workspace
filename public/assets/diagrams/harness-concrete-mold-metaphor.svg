<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto">
  <defs>
    <linearGradient id="harness-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="20" fill="url(#harness-bg)"/>
  <rect width="958" height="478" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Top Title Banner -->
  <g transform="translate(480, 38)">
    <text text-anchor="middle" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">HARNESS ENGINEERING VS AD-HOC VIBE CODING</text>
    <text text-anchor="middle" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="22" font-weight="900">建築學的降維對比：液態水泥直接傾倒 vs 鋼筋板模預先鎖定</text>
  </g>

  <!-- Left: Without Harness (Ad-hoc prompt mud spill) -->
  <g transform="translate(60, 95)">
    <rect width="400" height="340" rx="16" fill="rgba(239,68,68,0.05)" stroke="#EF4444" stroke-width="2"/>
    <rect width="400" height="8" rx="4" fill="#EF4444"/>

    <!-- Title Badge -->
    <g transform="translate(20, 20)">
      <rect width="180" height="26" rx="13" fill="rgba(239,68,68,0.2)"/>
      <text x="90" y="18" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">❌ 沒有 Harness：隨興瞎聊</text>
    </g>

    <!-- Visual Metaphor: Spill & Crack -->
    <g transform="translate(25, 60)">
      <!-- Ground line -->
      <line x1="0" y1="180" x2="350" y2="180" stroke="#64748B" stroke-width="3"/>
      
      <!-- Misshapen poured concrete blob -->
      <path d="M 60 180 Q 90 90, 160 110 Q 230 130, 280 180 Z" fill="#475569" stroke="#94A3B8" stroke-width="2"/>
      
      <!-- Cracks -->
      <path d="M 140 120 L 155 145 L 145 165 M 190 135 L 210 155" stroke="#EF4444" stroke-width="2" fill="none"/>
      
      <!-- Warning alerts -->
      <rect x="20" y="20" width="150" height="40" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
      <text x="95" y="44" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚠️ 隨意加裝 10 個依賴</text>

      <rect x="190" y="50" width="150" height="40" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
      <text x="265" y="74" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚠️ 程式碼到處幽會衝突</text>
    </g>

    <!-- Consequences -->
    <g transform="translate(25, 260)">
      <text y="0" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">💥 後果：液態泥流乾固成歪斜廢墟</text>
      <text y="22" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">• AI 自由發揮 = 隨機抽籤寫法，開新視窗就失憶</text>
      <text y="42" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">• 稍微修改一個小按鈕，整棟樓瞬間崩塌</text>
    </g>
  </g>

  <!-- Right: With Harness (Steel beams and mold plates) -->
  <g transform="translate(500, 95)">
    <rect width="400" height="340" rx="16" fill="rgba(16,185,129,0.05)" stroke="#10B981" stroke-width="2"/>
    <rect width="400" height="8" rx="4" fill="#10B981"/>

    <!-- Title Badge -->
    <g transform="translate(20, 20)">
      <rect width="200" height="26" rx="13" fill="rgba(16,185,129,0.2)"/>
      <text x="100" y="18" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">✅ 有 Harness：板模鷹架工程</text>
    </g>

    <!-- Visual Metaphor: Rigid Pillar Mold -->
    <g transform="translate(25, 60)">
      <!-- Ground line -->
      <line x1="0" y1="180" x2="350" y2="180" stroke="#64748B" stroke-width="3"/>
      
      <!-- Outer Wooden Mold Plates (Harness) -->
      <rect x="90" y="30" width="16" height="150" fill="#B45309" stroke="#F59E0B" stroke-width="1.5"/>
      <rect x="244" y="30" width="16" height="150" fill="#B45309" stroke="#F59E0B" stroke-width="1.5"/>
      
      <!-- Scaffold Clamps / Braces -->
      <line x1="60" y1="50" x2="106" y2="50" stroke="#38BDF8" stroke-width="3"/>
      <line x1="244" y1="50" x2="290" y2="50" stroke="#38BDF8" stroke-width="3"/>
      <line x1="60" y1="140" x2="106" y2="140" stroke="#38BDF8" stroke-width="3"/>
      <line x1="244" y1="140" x2="290" y2="140" stroke="#38BDF8" stroke-width="3"/>

      <!-- Perfect Concrete Pillar Confined Inside -->
      <rect x="106" y="35" width="138" height="145" fill="#334155" stroke="#10B981" stroke-width="2"/>

      <!-- Rebar Grid Inside -->
      <line x1="135" y1="40" x2="135" y2="175" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="175" y1="40" x2="175" y2="175" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="215" y1="40" x2="215" y2="175" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3"/>

      <text x="175" y="105" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">筆直承重柱</text>
      <text x="175" y="125" fill="#6EE7B7" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">Safe Code</text>

      <!-- Labels for Mold -->
      <rect x="15" y="75" width="65" height="24" rx="6" fill="#1E293B" stroke="#38BDF8"/>
      <text x="47" y="91" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">家規約束</text>

      <rect x="270" y="75" width="65" height="24" rx="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="302" y="91" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">規格藍圖</text>
    </g>

    <!-- Benefits -->
    <g transform="translate(25, 260)">
      <text y="0" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">🏆 結果：無論 AI 怎麼生成，形狀永遠筆直堅固</text>
      <text y="22" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5">• 寫扣前先立契約與防護欄，不給 AI 任何暴衝空間</text>
      <text y="42" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5">• 任何人、任何時間維護，都能如模組般精準拼裝</text>
    </g>
  </g>
</svg>
