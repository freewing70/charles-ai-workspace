<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto">
  <defs>
    <linearGradient id="arch04-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <marker id="arrow-cyan04" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-green04" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-amber04" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="20" fill="url(#arch04-bg)"/>
  <rect width="958" height="518" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(480, 36)">
    <text text-anchor="middle" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">BRAIN-HAND SEPARATION &amp; TIERED MODEL ROUTING</text>
    <text text-anchor="middle" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="21" font-weight="900">大腦與手腳分離架構：L1–L4 模型分流、Prefix 快取與契約回傳流</text>
  </g>

  <!-- Left Panel: Prefix Cache + Director Brain -->
  <g transform="translate(32, 90)">
    <rect width="260" height="390" rx="16" fill="rgba(99,102,241,0.08)" stroke="#6366F1" stroke-width="1.8"/>
    <rect width="260" height="8" rx="4" fill="#6366F1"/>

    <text x="130" y="34" fill="#C7D2FE" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">🧠 總監大腦層 (Director Brain)</text>
    <text x="130" y="53" fill="#94A3B8" font-family="monospace" font-size="10.5" text-anchor="middle">Flagship Model (Pro / Opus)</text>

    <!-- Prefix Cache Block -->
    <rect x="16" y="72" width="228" height="106" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="28" y="94" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">💾 Prefix Cache 靜態前綴區</text>
    <text x="28" y="114" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">• System Prompt &amp; 專案憲法</text>
    <text x="28" y="132" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">• Tool Schemas &amp; 領域知識庫</text>
    <rect x="28" y="144" width="204" height="22" rx="6" fill="rgba(245,158,11,0.16)"/>
    <text x="130" y="159" fill="#FDE68A" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Cache Hit: Input Cost -75% ~ -90%</text>

    <!-- Clean Context Window -->
    <rect x="16" y="192" width="228" height="108" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="1.4"/>
    <text x="28" y="214" fill="#A5B4FC" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">🧼 潔淨動態脈絡 (Clean State)</text>
    <text x="28" y="234" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">• 全域任務 DAG 與目前進度</text>
    <text x="28" y="252" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">• 僅收受 Subagent 結構化摘要</text>
    <text x="28" y="270" fill="#34D399" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700">✓ 杜絕 Context Rot（脈絡腐爛）</text>

    <!-- Dispatcher Output -->
    <rect x="16" y="314" width="228" height="58" rx="10" fill="#312E81" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="130" y="337" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">任務分派器 (Task Dispatcher)</text>
    <text x="130" y="356" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">Tag: L1 / L2 / L3 / L4 + Budget Cap</text>
  </g>

  <!-- Arrows Brain -> Router -->
  <line x1="294" y1="285" x2="338" y2="285" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrow-cyan04)"/>

  <!-- Center Panel: L1-L4 Model Tier Routing -->
  <g transform="translate(346, 90)">
    <rect width="310" height="390" rx="16" fill="rgba(15,23,42,0.85)" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="310" height="8" rx="4" fill="#38BDF8"/>

    <text x="155" y="34" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">🔀 L1–L4 難度矩陣與模型分流路由</text>
    <text x="155" y="53" fill="#94A3B8" font-family="monospace" font-size="10.5" text-anchor="middle">Dynamic Cost-Aware Model Router</text>

    <!-- L1 -->
    <rect x="16" y="72" width="278" height="68" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="1.3"/>
    <text x="28" y="94" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800">L1 機械搬運 / QA 巡檢 → Flash-Lite / Mini</text>
    <text x="28" y="112" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">檔案掃描、Regex 萃取、JSON 格式核對、Log 壓縮</text>
    <text x="28" y="129" fill="#6EE7B7" font-family="monospace" font-size="9.5">佔工作量 45% | 成本僅旗艦模型 1/30</text>

    <!-- L2 -->
    <rect x="16" y="150" width="278" height="68" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.3"/>
    <text x="28" y="172" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800">L2 標準實作 / 文案產出 → Flash / Haiku</text>
    <text x="28" y="190" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">單一元件開發、單元測試生成、技術文件初稿</text>
    <text x="28" y="207" fill="#7DD3FC" font-family="monospace" font-size="9.5">佔工作量 35% | 速度極快、性價比最高</text>

    <!-- L3 -->
    <rect x="16" y="228" width="278" height="68" rx="10" fill="#1E293B" stroke="#A78BFA" stroke-width="1.3"/>
    <text x="28" y="250" fill="#C4B5FD" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800">L3 跨模組除錯 / 重構 → Sonnet / Standard</text>
    <text x="28" y="268" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">多檔案狀態追蹤、API 整合修復、複雜商業邏輯</text>
    <text x="28" y="285" fill="#DDD6FE" font-family="monospace" font-size="9.5">佔工作量 15% | 精準度與成本最佳平衡點</text>

    <!-- L4 -->
    <rect x="16" y="306" width="278" height="68" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="28" y="328" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800">L4 系統架構 / 難題攻堅 → Pro / Opus</text>
    <text x="28" y="346" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">全局架構設計、高風險資安審計、L3 連敗兩次接手</text>
    <text x="28" y="363" fill="#FDE68A" font-family="monospace" font-size="9.5">佔工作量 5% | 好鋼只用在刀刃上</text>
  </g>

  <!-- Arrows Router -> Sandbox Workers -->
  <line x1="658" y1="210" x2="698" y2="210" stroke="#10B981" stroke-width="2.2" marker-end="url(#arrow-green04)"/>
  <!-- Return Contract Arrow Workers -> Brain (bottom arc) -->
  <path d="M 812 480 L 812 500 L 162 500 L 162 482" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-amber04)"/>
  <rect x="332" y="488" width="320" height="22" rx="11" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="492" y="503" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">📦 Return Contract：僅回傳 &lt; 150 字結構化摘要</text>

  <!-- Right Panel: Isolated Subagent Sandboxes -->
  <g transform="translate(706, 90)">
    <rect width="222" height="390" rx="16" fill="rgba(16,185,129,0.08)" stroke="#10B981" stroke-width="1.8"/>
    <rect width="222" height="8" rx="4" fill="#10B981"/>

    <text x="111" y="34" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">🛠️ 專職子代理沙盒</text>
    <text x="111" y="53" fill="#94A3B8" font-family="monospace" font-size="10.5" text-anchor="middle">Ephemeral Worker Context</text>

    <!-- Ephemeral Box -->
    <rect x="14" y="72" width="194" height="124" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="26" y="94" fill="#F87171" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800">🗑️ 一次性髒污隔離區</text>
    <text x="26" y="114" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">• 20KB 編譯錯誤 Stack Trace</text>
    <text x="26" y="132" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">• 50 次工具試錯與 grep 輸出</text>
    <text x="26" y="150" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">• 任務結束立即銷毀 Context</text>
    <text x="26" y="176" fill="#34D399" font-family="monospace" font-size="10" font-weight="700">Parent Pollution = 0%</text>

    <!-- Return Contract Spec -->
    <rect x="14" y="210" width="194" height="164" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.4"/>
    <text x="111" y="234" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">📜 強制交件契約格式</text>
    <text x="26" y="258" fill="#A7F3D0" font-family="monospace" font-size="10">status: PASS | FAIL</text>
    <text x="26" y="278" fill="#A7F3D0" font-family="monospace" font-size="10">files_touched: [path]</text>
    <text x="26" y="298" fill="#A7F3D0" font-family="monospace" font-size="10">summary: &lt;= 150 words</text>
    <text x="26" y="318" fill="#A7F3D0" font-family="monospace" font-size="10">evidence_hash: #sha</text>
    <text x="26" y="342" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700">禁止傾倒原始 Log 回大腦！</text>
    <text x="26" y="360" fill="#6EE7B7" font-family="monospace" font-size="9.5">Token Burn: -85% Overall</text>
  </g>
</svg>
