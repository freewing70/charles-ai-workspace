<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto">
  <defs>
    <linearGradient id="rollback-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-red-rb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F43F5E"/>
    </marker>
    <marker id="arrow-green-rb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="960" height="480" rx="20" fill="url(#rollback-bg)"/>
  <rect width="958" height="478" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Top Title Banner -->
  <g transform="translate(480, 38)">
    <text text-anchor="middle" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">TWO-STRIKES EMERGENCY BRAKE RULE</text>
    <text text-anchor="middle" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="22" font-weight="900">黃金煞車法則：AI 連續兩次道歉，立刻啟動時光機回滾！</text>
  </g>

  <!-- Left: Step 1 Clean Save Point -->
  <g transform="translate(70, 110)">
    <rect width="230" height="310" rx="16" fill="rgba(16,185,129,0.08)" stroke="#10B981" stroke-width="2"/>
    <g transform="translate(15, 20)">
      <rect width="200" height="28" rx="14" fill="rgba(16,185,129,0.2)"/>
      <text x="100" y="19" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">步驟 1：乾淨存檔點</text>
    </g>

    <circle cx="115" cy="115" r="34" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="115" y="123" text-anchor="middle" font-size="24">💾</text>

    <text x="115" y="180" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Git Commit / 快照</text>
    <text x="115" y="205" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">「功能正常，隨時可回溯」</text>

    <rect x="25" y="240" width="180" height="42" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="115" y="266" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">保留這份安全底牌</text>
  </g>

  <!-- Middle: Attempting changes -->
  <g transform="translate(365, 110)">
    <rect width="230" height="310" rx="16" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.5"/>
    <g transform="translate(15, 20)">
      <rect width="200" height="28" rx="14" fill="rgba(245,158,11,0.2)"/>
      <text x="100" y="19" fill="#FCD34D" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">步驟 2：指揮 AI 試作</text>
    </g>

    <circle cx="115" cy="100" r="28" fill="#78350F" stroke="#F59E0B" stroke-width="2"/>
    <text x="115" y="108" text-anchor="middle" font-size="20">🤖</text>

    <text x="115" y="150" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">第一次報錯：AI 道歉修復</text>
    
    <!-- Apology Counter Box -->
    <rect x="25" y="170" width="180" height="50" rx="8" fill="#451A03" stroke="#F59E0B"/>
    <text x="115" y="192" fill="#FCD34D" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">⚠️ 第二次依然報錯！</text>
    <text x="115" y="210" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">AI 開始反覆道歉</text>

    <!-- Danger Alert -->
    <text x="115" y="260" fill="#F87171" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">🛑 觸發二次道歉法則！</text>
    <text x="115" y="282" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">絕對不准讓它改第三次</text>
  </g>

  <!-- Right: Emergency Rollback Action -->
  <g transform="translate(660, 110)">
    <rect width="230" height="310" rx="16" fill="rgba(244,63,94,0.08)" stroke="#F43F5E" stroke-width="2"/>
    <g transform="translate(15, 20)">
      <rect width="200" height="28" rx="14" fill="rgba(244,63,94,0.2)"/>
      <text x="100" y="19" fill="#FDA4AF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">步驟 3：啟動時光機回滾</text>
    </g>

    <circle cx="115" cy="115" r="34" fill="#881337" stroke="#F43F5E" stroke-width="2"/>
    <text x="115" y="123" text-anchor="middle" font-size="24">⏪</text>

    <text x="115" y="180" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">一鍵 Discard / 回滾</text>
    <text x="115" y="205" fill="#FDA4AF" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">瞬間抹除所有垃圾補丁！</text>

    <rect x="25" y="240" width="180" height="42" rx="8" fill="#1E293B" stroke="#38BDF8"/>
    <text x="115" y="266" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">重開全新對話框重新出發</text>
  </g>

  <!-- Connector Lines -->
  <line x1="300" y1="230" x2="365" y2="230" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="595" y1="230" x2="660" y2="230" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrow-red-rb)"/>

  <!-- Return Loop Line from Right to Left -->
  <path d="M 775 420 C 775 465, 185 465, 185 420" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-green-rb)"/>
  <rect x="420" y="445" width="120" height="22" rx="11" fill="#064E3B" stroke="#10B981"/>
  <text x="480" y="460" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">無損恢復安全存檔點</text>
</svg>
