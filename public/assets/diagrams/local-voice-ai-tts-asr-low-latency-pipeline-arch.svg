<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-arch-10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <marker id="arrow-teal-10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2DD4BF"/>
    </marker>
    <marker id="arrow-red-10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="20" fill="url(#bg-arch-10)"/>
  <rect width="958" height="518" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(480, 36)">
    <text text-anchor="middle" fill="#2DD4BF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">SUB-500MS LOCAL VOICE AI · FULL-DUPLEX STREAMING PIPELINE</text>
    <text text-anchor="middle" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="21" font-weight="900">毫秒級本地語音助理管線對比：傳統阻塞式 (6.5s) vs 句讀串流全雙工 (&lt; 450ms)</text>
  </g>

  <!-- Top Row: Naive Sequential Pipeline (5-8s) -->
  <g transform="translate(30, 88)">
    <rect width="900" height="118" rx="14" fill="rgba(239,68,68,0.06)" stroke="#EF4444" stroke-width="1.5"/>
    <text x="20" y="26" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800">❌ 傳統「全等待」阻塞式管線：總延遲 5,000 ~ 8,000 ms（體感死板像對講機）</text>

    <rect x="20" y="42" width="170" height="56" rx="8" fill="#1E293B" stroke="#64748B"/>
    <text x="105" y="66" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">等待整段話講完</text>
    <text x="105" y="84" fill="#94A3B8" font-family="monospace" font-size="10.5" text-anchor="middle">+ 靜音偵測 1,200ms</text>

    <line x1="190" y1="70" x2="225" y2="70" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red-10)"/>

    <rect x="231" y="42" width="185" height="56" rx="8" fill="#1E293B" stroke="#64748B"/>
    <text x="323.5" y="66" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">整段音檔進 Whisper</text>
    <text x="323.5" y="84" fill="#FCA5A5" font-family="monospace" font-size="10.5" text-anchor="middle">ASR 阻塞 +900ms</text>

    <line x1="416" y1="70" x2="451" y2="70" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red-10)"/>

    <rect x="457" y="42" width="205" height="56" rx="8" fill="#1E293B" stroke="#64748B"/>
    <text x="559.5" y="66" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">等 LLM 生成完整 200 字</text>
    <text x="559.5" y="84" fill="#FCA5A5" font-family="monospace" font-size="10.5" text-anchor="middle">生成完才送出 +3,500ms</text>

    <line x1="662" y1="70" x2="697" y2="70" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red-10)"/>

    <rect x="703" y="42" width="177" height="56" rx="8" fill="#7F1D1D" stroke="#EF4444"/>
    <text x="791.5" y="66" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">整段 TTS 合成完整音檔</text>
    <text x="791.5" y="84" fill="#FECACA" font-family="monospace" font-size="10.5" text-anchor="middle">TTFA 累積 ~6.5 秒</text>
  </g>

  <!-- Bottom Row: Sub-500ms Streaming Pipeline -->
  <g transform="translate(30, 224)">
    <rect width="900" height="270" rx="14" fill="rgba(20,184,166,0.06)" stroke="#14B8A6" stroke-width="2"/>
    <text x="20" y="28" fill="#2DD4BF" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">✅ 超低延遲串流管線：Token 邊吐邊合成，首音延遲 (TTFA) 壓低至 350 ~ 480 ms！</text>

    <!-- Node 1: Silero VAD -->
    <rect x="20" y="52" width="175" height="122" rx="10" fill="#0F172A" stroke="#14B8A6" stroke-width="1.5"/>
    <rect x="20" y="52" width="175" height="24" rx="8" fill="#0F766E"/>
    <text x="107.5" y="68" fill="#FFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1. Silero VAD (20ms 幀)</text>
    <text x="107.5" y="96" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">即時偵測語音起訖點</text>
    <text x="107.5" y="116" fill="#99F6E4" font-family="monospace" font-size="10" text-anchor="middle">Endpoint = 300ms</text>
    <text x="107.5" y="138" fill="#FCD34D" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">⚡ 支援 Barge-in 搶話打斷</text>
    <text x="107.5" y="158" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">說話即刻清空 TTS 緩衝</text>

    <line x1="195" y1="113" x2="225" y2="113" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-teal-10)"/>

    <!-- Node 2: Faster-Whisper INT8 -->
    <rect x="231" y="52" width="190" height="122" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="231" y="52" width="190" height="24" rx="8" fill="#0284C7"/>
    <text x="326" y="68" fill="#FFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2. Faster-Whisper INT8</text>
    <text x="326" y="96" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">CTranslate2 量化加速</text>
    <text x="326" y="116" fill="#BAE6FD" font-family="monospace" font-size="10" text-anchor="middle">large-v3-turbo (INT8)</text>
    <text x="326" y="138" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">轉錄延遲：90 ~ 140 ms</text>
    <text x="326" y="158" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">VRAM 佔用僅約 1.1 GB</text>

    <line x1="421" y1="113" x2="451" y2="113" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-teal-10)"/>

    <!-- Node 3: Local LLM + Sentence Chunker -->
    <rect x="457" y="52" width="205" height="122" rx="10" fill="#0F172A" stroke="#A855F7" stroke-width="1.5"/>
    <rect x="457" y="52" width="205" height="24" rx="8" fill="#7E22CE"/>
    <text x="559.5" y="68" fill="#FFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">3. LLM 串流 + 句讀切塊</text>
    <text x="559.5" y="96" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">vLLM / Ollama 串流輸出</text>
    <text x="559.5" y="116" fill="#E9D5FF" font-family="monospace" font-size="10" text-anchor="middle">遇「，。！？\n」立即切句</text>
    <text x="559.5" y="138" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">首字延遲 (TTFT)：~80 ms</text>
    <text x="559.5" y="158" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">第 1 個短句 180ms 即送出</text>

    <line x1="662" y1="113" x2="692" y2="113" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-teal-10)"/>

    <!-- Node 4: CosyVoice 2 / Kokoro Streaming TTS -->
    <rect x="698" y="52" width="182" height="122" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <rect x="698" y="52" width="182" height="24" rx="8" fill="#059669"/>
    <text x="789" y="68" fill="#FFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">4. CosyVoice 2 / Kokoro</text>
    <text x="789" y="96" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">雙向串流語音合成 (Chunk)</text>
    <text x="789" y="116" fill="#A7F3D0" font-family="monospace" font-size="10" text-anchor="middle">24kHz PCM over WebRTC</text>
    <text x="789" y="138" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">首音塊出聲：~150 ms</text>
    <text x="789" y="158" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">邊播第 1 句、邊算第 2 句</text>

    <!-- Feedback / Barge-in & WebRTC Transport Bar -->
    <rect x="20" y="192" width="860" height="60" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="40" y="218" fill="#2DD4BF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">🔄 全雙工傳輸層 (WebRTC / LiveKit / FastAPI WebSocket)：</text>
    <text x="40" y="238" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">
      總 TTFA = 110ms (ASR) + 150ms (LLM 首句) + 150ms (TTS 首幀) ≈ <tspan fill="#6EE7B7" font-weight="800">410 ms</tspan>　|　使用者一開口，VAD 在 60ms 內發送 CANCEL 訊號打斷播放
    </text>
  </g>
</svg>