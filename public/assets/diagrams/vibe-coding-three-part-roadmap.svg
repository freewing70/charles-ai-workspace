  </defs>

  <rect width="960" height="480" rx="20" fill="url(#map-bg)"/>
  <rect width="958" height="478" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Top Title Banner -->
  <g transform="translate(480, 38)">
