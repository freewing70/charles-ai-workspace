<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-arch-08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <marker id="arrow-cyan-08" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-purple-08" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A855F7"/>
    </marker>
    <marker id="arrow-green-08" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="20" fill="url(#bg-arch-08)"/>
  <rect width="958" height="518" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(480, 36)">
    <text text-anchor="middle" fill="#A78BFA" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">GRAPHRAG DUAL-PHASE ARCHITECTURE · INDEXING &amp; RETRIEVAL</text>
    <text text-anchor="middle" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="21" font-weight="900">GraphRAG 知識圖譜檢索增強：離線 Leiden 社群建模與雙軌推理管線</text>
  </g>

  <!-- Top Section: Offline Indexing Pipeline -->
  <g transform="translate(30, 88)">
    <rect width="900" height="165" rx="14" fill="rgba(56,189,248,0.05)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="16" y="12" width="230" height="24" rx="12" fill="rgba(56,189,248,0.18)"/>
    <text x="131" y="28" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">PHASE 1 · 離線知識圖譜建置 (Indexing)</text>

    <!-- Step 1 -->
    <rect x="20" y="50" width="180" height="96" rx="10" fill="#0F172A" stroke="#475569"/>
    <text x="110" y="74" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">1. 原始語料切片</text>
    <text x="110" y="96" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">300 份企業合約 / 財報</text>
    <text x="110" y="114" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">TextUnits (600 tokens)</text>
    <text x="110" y="132" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">Overlap = 100 tokens</text>

    <line x1="200" y1="98" x2="232" y2="98" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan-08)"/>

    <!-- Step 2 -->
    <rect x="238" y="50" width="205" height="96" rx="10" fill="#0F172A" stroke="#38BDF8"/>
    <text x="340.5" y="74" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">2. 實體與關係抽取 (LLM)</text>
    <text x="340.5" y="96" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">抽取 Nodes (公司/條款/人物)</text>
    <text x="340.5" y="114" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">抽取 Edges (違約賠償/從屬)</text>
    <text x="340.5" y="132" fill="#6EE7B7" font-family="monospace" font-size="10" text-anchor="middle">Gleaning 多輪補全漏網實體</text>

    <line x1="443" y1="98" x2="475" y2="98" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-purple-08)"/>

    <!-- Step 3 -->
    <rect x="481" y="50" width="195" height="96" rx="10" fill="#0F172A" stroke="#A855F7"/>
    <text x="578.5" y="74" fill="#C4B5FD" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">3. Leiden 分層社群聚類</text>
    <text x="578.5" y="96" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">依圖拓撲密度自動劃分社群</text>
    <text x="578.5" y="114" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Level 0 (宏觀) → Level 2 (微觀)</text>
    <text x="578.5" y="132" fill="#C4B5FD" font-family="monospace" font-size="10" text-anchor="middle">Hierarchical Communities</text>

    <line x1="676" y1="98" x2="708" y2="98" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green-08)"/>

    <!-- Step 4 -->
    <rect x="714" y="50" width="166" height="96" rx="10" fill="#064E3B" stroke="#10B981"/>
    <text x="797" y="74" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">4. 社群摘要報告</text>
    <text x="797" y="96" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">預先生成每個聚類的</text>
    <text x="797" y="114" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Community Reports</text>
    <text x="797" y="132" fill="#A7F3D0" font-family="monospace" font-size="10" text-anchor="middle">存入 Parquet / Neo4j</text>
  </g>

  <!-- Bottom Section: Dual Search Modes -->
  <!-- Left: Global Search (Map-Reduce) -->
  <g transform="translate(30, 275)">
    <rect width="435" height="222" rx="14" fill="rgba(168,85,247,0.07)" stroke="#A855F7" stroke-width="1.5"/>
    <rect x="16" y="12" width="235" height="24" rx="12" fill="rgba(168,85,247,0.22)"/>
    <text x="133.5" y="28" fill="#DDD6FE" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">🌐 Global Search（宏觀全域 sensemaking）</text>

    <text x="18" y="58" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">適用問句：「這 300 份合約最常出現的 5 大風險主題是什麼？」</text>

    <rect x="18" y="74" width="122" height="72" rx="8" fill="#0F172A" stroke="#A855F7"/>
    <text x="79" y="96" fill="#C4B5FD" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Map 階段</text>
    <text x="79" y="116" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">並行掃描各層級</text>
    <text x="79" y="132" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">社群摘要產出分數</text>

    <line x1="140" y1="110" x2="164" y2="110" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-purple-08)"/>

    <rect x="170" y="74" width="118" height="72" rx="8" fill="#0F172A" stroke="#38BDF8"/>
    <text x="229" y="96" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">過濾高權重</text>
    <text x="229" y="116" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">依 Helpfulness</text>
    <text x="229" y="132" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">排序關鍵觀點</text>

    <line x1="288" y1="110" x2="312" y2="110" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green-08)"/>

    <rect x="318" y="74" width="100" height="72" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="368" y="96" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Reduce</text>
    <text x="368" y="116" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">歸納跨文件</text>
    <text x="368" y="132" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">全局精準結論</text>

    <text x="18" y="174" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">• 突破傳統 Top-K 只看 5 個片段的「盲人摸象」死穴</text>
    <text x="18" y="196" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">• 代價：單次查詢需多次平行 LLM Map 呼叫（可用輕量模型加速）</text>
  </g>

  <!-- Right: Local Search (Entity + Multi-hop) -->
  <g transform="translate(495, 275)">
    <rect width="435" height="222" rx="14" fill="rgba(16,185,129,0.07)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="16" y="12" width="235" height="24" rx="12" fill="rgba(16,189,129,0.22)"/>
    <text x="133.5" y="28" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">🎯 Local Search（微觀實體多跳推理）</text>

    <text x="18" y="58" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">適用問句：「A 公司擔保條款透過哪幾層子公司影響到 B 專案？」</text>

    <rect x="18" y="74" width="122" height="72" rx="8" fill="#0F172A" stroke="#38BDF8"/>
    <text x="79" y="96" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">向量定位錨點</text>
    <text x="79" y="116" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">比對最相似之</text>
    <text x="79" y="132" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">起始實體節點</text>

    <line x1="140" y1="110" x2="164" y2="110" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan-08)"/>

    <rect x="170" y="74" width="122" height="72" rx="8" fill="#0F172A" stroke="#10B981"/>
    <text x="231" y="96" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">1~2 跳鄰域擴展</text>
    <text x="231" y="116" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">撈取相鄰關係邊、</text>
    <text x="231" y="132" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">所屬社群 &amp; 原文</text>

    <line x1="292" y1="110" x2="316" y2="110" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green-08)"/>

    <rect x="322" y="74" width="96" height="72" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="370" y="96" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">脈絡生成</text>
    <text x="370" y="116" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">精準回答</text>
    <text x="370" y="132" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">跨頁因果鏈</text>

    <text x="18" y="174" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">• 結合 Vector 語意錨定 + Graph 拓撲遍歷，避免漏掉關鍵中間人</text>
    <text x="18" y="196" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">• 支援引用溯源 (Source Citation)，每條結論可回查原始文件段落</text>
  </g>
</svg>