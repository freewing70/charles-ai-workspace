<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto">
  <defs>
    <linearGradient id="gate-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <marker id="arrow-gate" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect width="960" height="480" rx="20" fill="url(#gate-bg)"/>
  <rect width="958" height="478" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Top Title Banner -->
  <g transform="translate(480, 38)">
    <text text-anchor="middle" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">ZERO-FRICTION AUTOMATED GATEKEEPERS</text>
    <text text-anchor="middle" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="22" font-weight="900">非工程師的三道自動化守門員：上線前絕不再心驚肉跳！</text>
  </g>

  <!-- Left: Code Commit Action -->
  <g transform="translate(40, 150)">
    <rect width="130" height="180" rx="14" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="65" cy="55" r="24" fill="#334155"/>
    <text x="65" y="62" text-anchor="middle" font-size="16">🚀</text>
    <text x="65" y="105" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">準備發布</text>
    <text x="65" y="128" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">按下上傳</text>
    <text x="65" y="146" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Trigger Build</text>
  </g>

  <!-- Arrow 0 -> 1 -->
  <line x1="170" y1="240" x2="215" y2="240" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-gate)"/>

  <!-- Gate 1: 404 Dead Link Check -->
  <g transform="translate(225, 120)">
    <rect width="180" height="240" rx="14" fill="rgba(56,189,248,0.06)" stroke="#38BDF8" stroke-width="2"/>
    <rect width="180" height="8" rx="4" fill="#38BDF8"/>
    
    <circle cx="90" cy="45" r="22" fill="rgba(56,189,248,0.2)"/>
    <text x="90" y="52" text-anchor="middle" font-size="16">🔍</text>
    
    <text x="90" y="92" fill="#7DD3FC" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">守門員 1：死鏈掃描</text>
    <text x="90" y="112" fill="#38BDF8" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">404 Link Audit</text>

    <text x="90" y="145" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">• 自動掃描全站所有</text>
    <text x="90" y="165" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">href 與圖片路徑</text>
    <text x="90" y="188" fill="#FDA4AF" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">• 抓到斷鏈立刻報警</text>

    <rect x="25" y="202" width="130" height="24" rx="12" fill="#064E3B"/>
    <text x="90" y="218" fill="#34D399" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">✓ 0 死連結才放行</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="405" y1="240" x2="450" y2="240" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-gate)"/>

  <!-- Gate 2: File Size Redline Check -->
  <g transform="translate(460, 120)">
    <rect width="180" height="240" rx="14" fill="rgba(245,158,11,0.06)" stroke="#F59E0B" stroke-width="2"/>
    <rect width="180" height="8" rx="4" fill="#F59E0B"/>
    
    <circle cx="90" cy="45" r="22" fill="rgba(245,158,11,0.2)"/>
    <text x="90" y="52" text-anchor="middle" font-size="16">⚖️</text>
    
    <text x="90" y="92" fill="#FCD34D" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">守門員 2：體積紅線</text>
    <text x="90" y="112" fill="#F59E0B" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">Asset Size Check</text>

    <text x="90" y="145" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">• 單圖超過 500KB？</text>
    <text x="90" y="165" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">• 腳本包過大？</text>
    <text x="90" y="188" fill="#FDA4AF" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">• 嚴防肥大資產偷渡</text>

    <rect x="25" y="202" width="130" height="24" rx="12" fill="#064E3B"/>
    <text x="90" y="218" fill="#34D399" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">✓ 體積合格才放行</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="640" y1="240" x2="685" y2="240" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-gate)"/>

  <!-- Gate 3: Schema Validation Check -->
  <g transform="translate(695, 120)">
    <rect width="180" height="240" rx="14" fill="rgba(168,85,247,0.06)" stroke="#A855F7" stroke-width="2"/>
    <rect width="180" height="8" rx="4" fill="#A855F7"/>
    
    <circle cx="90" cy="45" r="22" fill="rgba(168,85,247,0.2)"/>
    <text x="90" y="52" text-anchor="middle" font-size="16">📋</text>
    
    <text x="90" y="92" fill="#D8B4FE" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">守門員 3：規格快篩</text>
    <text x="90" y="112" fill="#A855F7" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">Schema Validator</text>

    <text x="90" y="145" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">• 必要欄位是否缺漏？</text>
    <text x="90" y="165" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">• 日期格式是否正確？</text>
    <text x="90" y="188" fill="#FDA4AF" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">• 嚴防髒資料入庫</text>

    <rect x="25" y="202" width="130" height="24" rx="12" fill="#064E3B"/>
    <text x="90" y="218" fill="#34D399" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">✓ 格式 100% 通過</text>
  </g>

  <!-- Bottom Victory Pill -->
  <g transform="translate(480, 420)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" fill="#34D399" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800">🎉 三道自動守門全數通過 ➔ 100% 放心發布，不怕線上出糗！</text>
  </g>
</svg>
