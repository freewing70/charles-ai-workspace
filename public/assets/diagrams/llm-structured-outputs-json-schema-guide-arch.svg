<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="100%" height="auto">
  <defs>
    <linearGradient id="arch05-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <marker id="arrow05-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow05-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="960" height="510" rx="20" fill="url(#arch05-bg)"/>
  <rect width="958" height="508" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(480, 36)">
    <text text-anchor="middle" fill="#34D399" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">LOGITS-LEVEL CONSTRAINED DECODING ARCHITECTURE</text>
    <text text-anchor="middle" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="21" font-weight="900">從「Prompt 祈禱」到「Logits 層 FSM Token 遮罩」的 100% 穩定管線</text>
  </g>

  <!-- Top Row: Fragile Prompt-Only Path -->
  <g transform="translate(36, 86)">
    <rect width="888" height="145" rx="14" fill="rgba(239,68,68,0.07)" stroke="#EF4444" stroke-width="1.5"/>
    <text x="20" y="28" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800">❌ 傳統脆弱做法：Prompt 祈禱「請務必只回傳純 JSON」 (線上失敗率 5%–15%)</text>

    <rect x="20" y="46" width="180" height="80" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="110" y="76" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">非結構化 Prompt</text>
    <text x="110" y="98" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">「不要 Markdown 標籤」</text>
    <text x="110" y="114" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">全靠模型語氣猜測</text>

    <line x1="205" y1="86" x2="245" y2="86" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow05-red)"/>

    <rect x="252" y="46" width="210" height="80" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="357" y="74" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">無約束自由採樣 (Sampling)</text>
    <text x="357" y="96" fill="#CBD5E1" font-family="monospace" font-size="10.5" text-anchor="middle">詞彙表 100k+ Tokens 全開放</text>
    <text x="357" y="114" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">隨溫度 (Temperature) 飄移</text>

    <line x1="467" y1="86" x2="507" y2="86" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow05-red)"/>

    <rect x="514" y="46" width="354" height="80" rx="10" fill="#7F1D1D" stroke="#EF4444"/>
    <text x="530" y="70" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">💥 常見管線崩潰型態：</text>
    <text x="530" y="90" fill="#FEE2E2" font-family="monospace" font-size="10.5">1. 包裹 ```json ... ``` 或廢話前言</text>
    <text x="530" y="106" fill="#FEE2E2" font-family="monospace" font-size="10.5">2. 尾端多出逗號 (Trailing Comma) / 缺右括號</text>
    <text x="530" y="122" fill="#FEE2E2" font-family="monospace" font-size="10.5">3. 幻覺欄位名、型別錯亂 (字串塞進 Number)</text>
  </g>

  <!-- Bottom Row: Constrained Decoding Pipeline -->
  <g transform="translate(36, 252)">
    <rect width="888" height="226" rx="14" fill="rgba(16,185,129,0.08)" stroke="#10B981" stroke-width="1.8"/>
    <text x="20" y="28" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800">✅ 企業級穩定架構：Constrained Decoding（CFG / FSM 編譯至 Logits 遮罩層，合規率 100%）</text>

    <!-- Step 1 -->
    <rect x="20" y="50" width="185" height="152" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="112" y="76" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">1. Schema 編譯階段</text>
    <text x="32" y="100" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">• Zod / Pydantic 定義</text>
    <text x="32" y="120" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">• 編譯為 Context-Free</text>
    <text x="32" y="136" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">  Grammar (CFG) 與</text>
    <text x="32" y="152" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">  有限狀態機 (FSM)</text>
    <text x="112" y="184" fill="#7DD3FC" font-family="monospace" font-size="9.5" text-anchor="middle">首次冷啟動快取 DFA</text>

    <line x1="210" y1="126" x2="244" y2="126" stroke="#10B981" stroke-width="2" marker-end="url(#arrow05-green)"/>

    <!-- Step 2 -->
    <rect x="250" y="50" width="215" height="152" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="357" y="76" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">2. Logits Token 遮罩</text>
    <text x="264" y="100" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">每個解碼步 (Step t)：</text>
    <text x="264" y="120" fill="#E2E8F0" font-family="monospace" font-size="10">FSM 計算當前合法字符集</text>
    <text x="264" y="140" fill="#F87171" font-family="monospace" font-size="10">非法 Token -&gt; logit = -inf</text>
    <text x="264" y="160" fill="#34D399" font-family="monospace" font-size="10">合法 Token -&gt; Softmax 採樣</text>
    <text x="357" y="184" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">結構 Token 機率歸一化 = 100%</text>

    <line x1="470" y1="126" x2="504" y2="126" stroke="#10B981" stroke-width="2" marker-end="url(#arrow05-green)"/>

    <!-- Step 3 -->
    <rect x="510" y="50" width="180" height="152" rx="10" fill="#0F172A" stroke="#A78BFA" stroke-width="1.4"/>
    <text x="600" y="76" fill="#C4B5FD" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">3. 跨平台引擎實作</text>
    <text x="524" y="102" fill="#CBD5E1" font-family="monospace" font-size="10">• OpenAI: strict: true</text>
    <text x="524" y="122" fill="#CBD5E1" font-family="monospace" font-size="10">• Gemini: responseSchema</text>
    <text x="524" y="142" fill="#CBD5E1" font-family="monospace" font-size="10">• Claude: Tool Use / JSON</text>
    <text x="524" y="162" fill="#CBD5E1" font-family="monospace" font-size="10">• vLLM: guided_json</text>
    <text x="600" y="184" fill="#DDD6FE" font-family="-apple-system, sans-serif" font-size="9.5" text-anchor="middle">Outlines / xgrammar</text>

    <line x1="695" y1="126" x2="729" y2="126" stroke="#10B981" stroke-width="2" marker-end="url(#arrow05-green)"/>

    <!-- Step 4 -->
    <rect x="735" y="50" width="134" height="152" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="802" y="76" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">4. 管線安全防護</text>
    <text x="747" y="104" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="10.5">✓ Refusal 欄分離</text>
    <text x="747" y="126" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="10.5">✓ Partial Stream</text>
    <text x="747" y="148" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="10.5">✓ Discriminated</text>
    <text x="756" y="163" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="10.5">Union 型別保護</text>
    <text x="802" y="186" fill="#34D399" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">Zero Parse Error</text>
  </g>
</svg>
