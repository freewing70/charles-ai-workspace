<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-arch-09" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <marker id="arrow-cyan-09" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-green-09" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-red-09" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="20" fill="url(#bg-arch-09)"/>
  <rect width="958" height="518" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(480, 36)">
    <text text-anchor="middle" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">PLAYWRIGHT MCP · 5-STEP SELF-VERIFYING FRONTEND LOOP</text>
    <text text-anchor="middle" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="21" font-weight="900">Vibe Coding 自動化驗收閉環：讓 AI 寫完網頁自己開瀏覽器跑完 E2E 測試</text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(30, 95)">
    <rect width="160" height="145" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <rect width="160" height="28" rx="10" fill="#0284C7"/>
    <text x="80" y="19" fill="#FFF" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">STEP 1 · 啟動與健康檢查</text>
    <text x="80" y="55" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Start Dev Server</text>
    <text x="80" y="78" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">npm run dev</text>
    <text x="80" y="98" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">偵測 port 4321 / 3000</text>
    <text x="80" y="118" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">確認 Build 無編譯錯誤</text>
  </g>

  <line x1="190" y1="167" x2="215" y2="167" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan-09)"/>

  <!-- Step 2 -->
  <g transform="translate(221, 95)">
    <rect width="175" height="145" rx="12" fill="#0F172A" stroke="#A855F7" stroke-width="2"/>
    <rect width="175" height="28" rx="10" fill="#7E22CE"/>
    <text x="87.5" y="19" fill="#FFF" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">STEP 2 · 無頭瀏覽 &amp; 捕錯</text>
    <text x="87.5" y="55" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Console &amp; Network Trap</text>
    <text x="87.5" y="78" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">監聽 pageerror 事件</text>
    <text x="87.5" y="98" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">攔截 4xx / 5xx API 失敗</text>
    <text x="87.5" y="118" fill="#D8B4FE" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">抓出 Hydration Mismatch</text>
  </g>

  <line x1="396" y1="167" x2="421" y2="167" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan-09)"/>

  <!-- Step 3 -->
  <g transform="translate(427, 95)">
    <rect width="175" height="145" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <rect width="175" height="28" rx="10" fill="#D97706"/>
    <text x="87.5" y="19" fill="#FFF" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">STEP 3 · A11y 語意樹定位</text>
    <text x="87.5" y="55" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Accessibility Snapshot</text>
    <text x="87.5" y="78" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">免猜 CSS selector</text>
    <text x="87.5" y="98" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">直接讀取 role / aria-label</text>
    <text x="87.5" y="118" fill="#FCD34D" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">模擬真實點擊表單與導航</text>
  </g>

  <line x1="602" y1="167" x2="627" y2="167" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan-09)"/>

  <!-- Step 4 -->
  <g transform="translate(633, 95)">
    <rect width="175" height="145" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <rect width="175" height="28" rx="10" fill="#059669"/>
    <text x="87.5" y="19" fill="#FFF" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">STEP 4 · 雙視口視覺檢測</text>
    <text x="87.5" y="55" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Viewport &amp; Layout Diff</text>
    <text x="87.5" y="78" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">375x812 (Mobile)</text>
    <text x="87.5" y="98" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">1440x900 (Desktop)</text>
    <text x="87.5" y="118" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">檢查水平捲軸溢出 &amp; 重疊</text>
  </g>

  <!-- Decision Diamond / Box -->
  <line x1="808" y1="167" x2="833" y2="167" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green-09)"/>
  <g transform="translate(838, 112)">
    <rect width="92" height="110" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="46" y="42" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">驗收閘門</text>
    <text x="46" y="66" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0 Error?</text>
    <text x="46" y="88" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Pass / Fail</text>
  </g>

  <!-- Pass Path (Down-Right) -->
  <path d="M 884 222 L 884 295 L 745 295" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green-09)"/>
  <g transform="translate(530, 265)">
    <rect width="210" height="60" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="105" y="26" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" text-anchor="middle">✅ 驗收通過 · 才准喊 Done</text>
    <text x="105" y="46" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">附上測試通過報告與實機截圖</text>
  </g>

  <!-- Fail Path -> Step 5 Auto-Fix Loop -->
  <path d="M 884 222 L 884 378 L 485 378" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-red-09)"/>
  <text x="720" y="368" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">❌ 若發現 Console Error 或破版截圖</text>

  <g transform="translate(150, 336)">
    <rect width="330" height="86" rx="12" fill="rgba(239,68,68,0.1)" stroke="#EF4444" stroke-width="2"/>
    <text x="165" y="26" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">STEP 5 · 帶著證據自動自癒 (Auto-Fix &amp; Re-test)</text>
    <text x="165" y="48" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">將 Error Stack + DOM Snapshot + 截圖直接餵回 AI</text>
    <text x="165" y="68" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">修完自動重跑 Step 2 ~ Step 4（最多重試 3 次防無限迴圈）</text>
  </g>

  <!-- Loop Back Arrow to Step 2 -->
  <path d="M 150 378 L 110 378 L 110 245" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan-09)"/>

  <!-- Bottom Comparison Strip -->
  <g transform="translate(30, 442)">
    <rect width="900" height="54" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="24" y="32" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">💡 雙劍合璧最佳實務：</text>
    <text x="190" y="32" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5">
      開發期用 <tspan fill="#6EE7B7" font-weight="700">Playwright / Chrome DevTools MCP</tspan> 即時探勘與修 Bug　|　合併前用 <tspan fill="#FCD34D" font-weight="700">playwright.config.ts 腳本</tspan> 納入 CI 永久回歸防線
    </text>
  </g>
</svg>