<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="auto">
  <defs>
    <linearGradient id="comfy-cover-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <pattern id="comfy-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(245,158,11,0.06)" stroke-width="1"/>
    </pattern>

    <radialGradient id="comfy-glow" cx="78%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#comfy-cover-bg)"/>
  <rect width="960" height="500" fill="url(#comfy-grid)"/>
  <circle cx="750" cy="180" r="280" fill="url(#comfy-glow)"/>

  <!-- Left Content Column -->
  <g transform="translate(60, 58)">
    <rect width="275" height="30" rx="15" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="5" fill="#F59E0B"/>
    <text x="30" y="20" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">AI CINEMATOGRAPHY · COMFYUI</text>

    <text y="78" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="31" font-weight="900" letter-spacing="-0.5">
      ComfyUI 工作流工程化實戰
    </text>
    <text y="122" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">
      從單張抽卡走向 API 量產與固定種子控圖
    </text>

    <text y="165" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="400">
      商業動畫與遊戲美術團隊最怕「換張圖角色就變臉、客戶改字就要重抽」？
    </text>
    <text y="190" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="600">
      拆解 5 階段模組化節點、Headless API 排程、FP8 顯存管理與自動化批次生成！
    </text>

    <!-- Key Takeaway Pills -->
    <g transform="translate(0, 232)">
      <rect width="180" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="90" y="23" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">🎬 5 階段模組化管線</text>

      <rect x="195" width="185" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="287" y="23" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">⚡ Headless API 量產</text>

      <rect x="395" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="485" y="23" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">🎯 固定種子 &amp; FP8 省顯存</text>
    </g>

    <g transform="translate(0, 342)">
      <line x1="0" y1="0" x2="540" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text y="28" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">
        FREEWINGBIZ · CHARLES AI WORKSPACE | 2026 實戰系列教學
      </text>
    </g>
  </g>

  <!-- Right Visual: Modular Node Graph to API Batch -->
  <g transform="translate(652, 88)">
    <rect width="248" height="330" rx="16" fill="rgba(15,23,42,0.88)" stroke="#F59E0B" stroke-width="2"/>
    <rect width="248" height="10" rx="5" fill="#F59E0B"/>

    <rect x="36" y="22" width="176" height="24" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="124" y="38" fill="#FDE68A" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">WORKFLOW_API.JSON</text>

    <!-- Node 1 -->
    <rect x="22" y="60" width="96" height="52" rx="8" fill="#1E293B" stroke="#38BDF8"/>
    <text x="70" y="82" fill="#7DD3FC" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1. Loader</text>
    <text x="70" y="99" fill="#94A3B8" font-family="monospace" font-size="9.5" text-anchor="middle">FP8 + LoRA</text>

    <!-- Node 2 -->
    <rect x="130" y="60" width="96" height="52" rx="8" fill="#1E293B" stroke="#A78BFA"/>
    <text x="178" y="82" fill="#DDD6FE" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2. Pose Lock</text>
    <text x="178" y="99" fill="#94A3B8" font-family="monospace" font-size="9.5" text-anchor="middle">IPA + ControlNet</text>

    <!-- Connecting wires -->
    <path d="M 70 112 L 70 138 L 124 138 L 124 148" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <path d="M 178 112 L 178 138 L 124 138" fill="none" stroke="#A78BFA" stroke-width="2"/>

    <!-- Node 3: Two-pass Sampler -->
    <rect x="28" y="148" width="192" height="54" rx="8" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="124" y="170" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">3. KSampler Two-Pass</text>
    <text x="124" y="189" fill="#FBBF24" font-family="monospace" font-size="10" text-anchor="middle">Fixed Seed · Latent Upscale</text>

    <line x1="124" y1="202" x2="124" y2="226" stroke="#10B981" stroke-width="2"/>

    <!-- Node 4 & 5 -->
    <rect x="28" y="226" width="192" height="76" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="124" y="249" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">4. Detailer &amp; 5. Export</text>
    <text x="124" y="269" fill="#A7F3D0" font-family="monospace" font-size="10" text-anchor="middle">Face/Hand Repair + Metadata</text>
    <text x="124" y="288" fill="#34D399" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Python / Node.js Queue 量產</text>
  </g>
</svg>
