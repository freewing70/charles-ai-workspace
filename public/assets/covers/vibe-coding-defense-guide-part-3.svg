<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vibe3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B091A"/>
      <stop offset="45%" stop-color="#1A103C"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Shield & Victory Accents -->
    <linearGradient id="purple-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#vibe3-bg)"/>

  <!-- Blueprint Architectural Grid Lines -->
  <g stroke="rgba(168, 85, 247, 0.06)" stroke-width="1.5">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="1060" cy="180" r="280" fill="#FBBF24" opacity="0.14" filter="blur(75px)"/>
  <circle cx="150" cy="480" r="230" fill="#A855F7" opacity="0.14" filter="blur(70px)"/>
  <circle cx="650" cy="300" r="180" fill="#C084FC" opacity="0.08" filter="blur(80px)"/>

  <!-- Security Shield & Checkmark Graphic on Right -->
  <g transform="translate(860, 160)">
    <!-- Shield Outline -->
    <path d="M 0 40 L 90 75 C 90 180, 0 250, 0 250 C 0 250, -90 180, -90 75 Z" fill="rgba(30, 27, 75, 0.8)" stroke="#A855F7" stroke-width="4"/>
    <path d="M 0 55 L 75 85 C 75 168, 0 230, 0 230 C 0 230, -75 168, -75 85 Z" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 3"/>

    <!-- Checkmark Inside Shield -->
    <path d="M -30 140 L -8 165 L 35 115" fill="none" stroke="#FBBF24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Floating Badge -->
    <rect x="-85" y="275" width="170" height="36" rx="18" fill="rgba(251, 191, 36, 0.18)" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="0" y="298" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">🛡️ 100% 安心自動守門</text>
  </g>

  <!-- Main Content Header -->
  <g transform="translate(100, 95)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="260" height="34" rx="17" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)"/>
    <text x="130" y="22" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.5">VIBE CODING SERIES · PART 3</text>
    
    <!-- Title Lines -->
    <text x="0" y="95" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">Vibe Coding 不翻車指南（下）</text>
    <text x="0" y="165" fill="url(#purple-gold)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="36" font-weight="800">告別「動一行崩全家」的長治久安 SOP</text>
    
    <!-- Subtitle Details -->
    <text x="0" y="235" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="20" font-weight="500">
      API 金鑰防盜刷機制 · 三道零負擔自動守門員 · 專案長大後的 AI 全身健檢指南
    </text>
  </g>

  <!-- Feature Cards Row -->
  <g transform="translate(100, 365)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="72" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="32" cy="36" r="15" fill="rgba(244,63,94,0.2)"/>
      <text x="32" y="41" fill="#F43F5E" font-size="13" font-weight="bold" text-anchor="middle">🔐</text>
      <text x="58" y="31" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">金鑰保險箱法則</text>
      <text x="58" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">徹底杜絕破產式盜刷</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(230, 0)">
      <rect width="210" height="72" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="32" cy="36" r="15" fill="rgba(56,189,248,0.2)"/>
      <text x="32" y="41" fill="#38BDF8" font-size="13" font-weight="bold" text-anchor="middle">🤖</text>
      <text x="58" y="31" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">三道自動化守門</text>
      <text x="58" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">死鏈、體積、規格攔截</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(460, 0)">
      <rect width="210" height="72" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="32" cy="36" r="15" fill="rgba(245,158,11,0.2)"/>
      <text x="32" y="41" fill="#F59E0B" font-size="13" font-weight="bold" text-anchor="middle">🩺</text>
      <text x="58" y="31" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">定期 AI 全身健檢</text>
      <text x="58" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">專案長大不失控</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(690, 0)">
      <rect width="210" height="72" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="32" cy="36" r="15" fill="rgba(168,85,247,0.2)"/>
      <text x="32" y="41" fill="#C084FC" font-size="13" font-weight="bold" text-anchor="middle">🏁</text>
      <text x="58" y="31" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">終極長治久安</text>
      <text x="58" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">三部曲完結全景防線</text>
    </g>
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(100, 490)">
    <rect x="0" y="0" width="1000" height="1" fill="rgba(255,255,255,0.15)"/>
    <text x="0" y="45" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">FREEWINGBIZ</text>
    <text x="140" y="45" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">｜ 智能時代架構指南 2026</text>
    <text x="1000" y="45" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="end">freewingbiz.com/tutorials</text>
  </g>
</svg>
