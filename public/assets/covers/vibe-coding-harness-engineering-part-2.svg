<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="auto">
  <defs>
    <linearGradient id="cover-bg-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <pattern id="grid-pattern-2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56,189,248,0.06)" stroke-width="1"/>
    </pattern>

    <radialGradient id="neon-glow-2" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="500" fill="url(#cover-bg-2)"/>
  <rect width="960" height="500" fill="url(#grid-pattern-2)"/>
  <circle cx="750" cy="180" r="280" fill="url(#neon-glow-2)"/>

  <!-- Left Content Column -->
  <g transform="translate(60, 60)">
    <!-- Series Badge -->
    <rect width="260" height="30" rx="15" fill="rgba(99,102,241,0.18)" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="5" fill="#818CF8"/>
    <text x="30" y="20" fill="#A5B4FC" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">VIBE CODING ADVANCED · PART 2</text>

    <!-- Main Title -->
    <text y="78" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      打造閉環自癒的「自動試車台」
    </text>
    
    <text y="122" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">
      不用看懂程式碼，讓 AI 自己改考卷修到好
    </text>

    <!-- Description -->
    <text y="165" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="400">
      別再當 AI 的人工改考卷老師！手動點網頁測試又累又容易漏。
    </text>
    <text y="190" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="600">
      學會 F1 賽車試車台架構與閉環反饋機制，讓 AI 在背景自動除錯到 100% 綠燈！
    </text>

    <!-- Key Takeaway Pills -->
    <g transform="translate(0, 230)">
      <rect width="180" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="90" y="23" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">🏎️ F1 室內試車台哲學</text>

      <rect x="195" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="285" y="23" fill="#818CF8" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">🔄 閉環自癒自檢循環</text>

      <rect x="390" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="480" y="23" fill="#34D399" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">🚦 一鍵冒煙健康檢查</text>
    </g>

    <!-- Author & Domain Brand -->
    <g transform="translate(0, 340)">
      <line x1="0" y1="0" x2="520" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text y="28" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">
        FREEWINGBIZ · CHARLES AI WORKSPACE | 2026 實戰系列教學完結篇
      </text>
    </g>
  </g>

  <!-- Right Visual: The Self-Healing Test Rig Dial -->
  <g transform="translate(640, 100)">
    <rect width="250" height="310" rx="16" fill="rgba(15,23,42,0.85)" stroke="#6366F1" stroke-width="2"/>
    <rect width="250" height="10" rx="5" fill="#6366F1"/>

    <!-- Dashboard Gauge Outer Ring -->
    <circle cx="125" cy="120" r="65" fill="none" stroke="#334155" stroke-width="10"/>
    <circle cx="125" cy="120" r="65" fill="none" stroke="#10B981" stroke-width="10" stroke-dasharray="320" stroke-dashoffset="60"/>

    <circle cx="125" cy="120" r="48" fill="#1E1B4B"/>
    <text x="125" y="115" fill="#34D399" font-family="monospace" font-size="22" font-weight="900" text-anchor="middle">100%</text>
    <text x="125" y="135" fill="#A5B4FC" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">HEALTHY</text>

    <!-- Test Step Checklist in Rig -->
    <g transform="translate(25, 195)">
      <rect width="200" height="24" rx="6" fill="#1E293B"/>
      <circle cx="15" cy="12" r="4" fill="#34D399"/>
      <text x="28" y="16" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Build Compile: PASS</text>

      <rect y="30" width="200" height="24" rx="6" fill="#1E293B"/>
      <circle cx="15" cy="12" r="4" fill="#34D399"/>
      <text x="28" y="16" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">404 Dead Link: PASS (0)</text>

      <rect y="60" width="200" height="24" rx="6" fill="#1E293B"/>
      <circle cx="15" cy="12" r="4" fill="#34D399"/>
      <text x="28" y="16" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Rule Constitution: PASS</text>
    </g>

    <!-- Top Badge -->
    <rect x="50" y="20" width="150" height="22" rx="11" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2"/>
    <text x="125" y="35" fill="#C7D2FE" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">TEST RIG HARNESS</text>
  </g>
</svg>
