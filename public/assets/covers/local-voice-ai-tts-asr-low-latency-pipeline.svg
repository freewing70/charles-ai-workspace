    <g transform="translate(30, 62)">
      <rect x="0" y="18" width="8" height="24" rx="4" fill="#14B8A6"/>
      <rect x="14" y="10" width="8" height="40" rx="4" fill="#2DD4BF"/>
      <rect x="28" y="4" width="8" height="52" rx="4" fill="#38BDF8"/>
      <rect x="42" y="14" width="8" height="32" rx="4" fill="#14B8A6"/>
      <rect x="56" y="2" width="8" height="56" rx="4" fill="#A855F7"/>
      <rect x="70" y="12" width="8" height="36" rx="4" fill="#38BDF8"/>
      <rect x="84" y="6" width="8" height="48" rx="4" fill="#2DD4BF"/>
      <rect x="98" y="18" width="8" height="24" rx="4" fill="#14B8A6"/>
      <rect x="112" y="8" width="8" height="44" rx="4" fill="#38BDF8"/>
      <rect x="126" y="14" width="8" height="32" rx="4" fill="#A855F7"/>
      <rect x="140" y="4" width="8" height="52" rx="4" fill="#2DD4BF"/>
      <rect x="154" y="12" width="8" height="36" rx="4" fill="#14B8A6"/>
      <rect x="168" y="20" width="8" height="20" rx="4" fill="#38BDF8"/>
      <rect x="182" y="16" width="8" height="28" rx="4" fill="#14B8A6"/>
    </g>

    <!-- Pipeline Nodes -->
    <rect x="22" y="135" width="206" height="32" rx="8" fill="#1E293B" stroke="#14B8A6"/>
    <text x="125" y="155" fill="#99F6E4" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. Silero VAD + Faster-Whisper INT8</text>

    <rect x="22" y="177" width="206" height="32" rx="8" fill="#1E293B" stroke="#38BDF8"/>
    <text x="125" y="197" fill="#BAE6FD" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. Local LLM 句讀切塊串流</text>

    <rect x="22" y="219" width="206" height="32" rx="8" fill="#1E293B" stroke="#A855F7"/>
    <text x="125" y="239" fill="#E9D5FF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">3. CosyVoice 2 / Kokoro WebRTC</text>

    <rect x="35" y="265" width="180" height="30" rx="15" fill="#0F766E" stroke="#2DD4BF"/>
    <text x="125" y="284" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">🔊 100% 離線 · 零雲端延遲</text>
