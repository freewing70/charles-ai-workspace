<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="auto">
  <defs>
    <linearGradient id="cover04-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <pattern id="grid04" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56,189,248,0.06)" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow04" cx="78%" cy="35%" r="52%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <marker id="arrow04" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="500" fill="url(#cover04-bg)"/>
  <rect width="960" height="500" fill="url(#grid04)"/>
  <circle cx="745" cy="185" r="290" fill="url(#glow04)"/>

  <!-- Left Content Column -->
  <g transform="translate(56, 56)">
    <!-- Badge -->
    <rect width="310" height="30" rx="15" fill="rgba(99,102,241,0.18)" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="16" cy="15" r="5" fill="#38BDF8"/>
    <text x="30" y="20" fill="#A5B4FC" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.4">AGENT ENGINEERING · COST &amp; ROUTING</text>

    <!-- Main Title -->
    <text y="78" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="33" font-weight="900" letter-spacing="-0.5">
      Multi-Agent 調度與 Token 精算
    </text>

    <text y="122" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">
      大腦與手腳分離架構、模型分流與 Context 快取實戰
    </text>

    <!-- Description -->
    <text y="166" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="400">
      單一巨獸 Agent 迴圈不僅會引發 Context Rot，更會讓帳單暴漲 10 倍？
    </text>
    <text y="191" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="600">
      用「總監大腦 + 專職子代理」搭配 L1–L4 模型分流與 Prefix Caching，砍掉 85% 冗餘花費。
    </text>

    <!-- Key Takeaway Pills -->
    <g transform="translate(0, 232)">
      <rect width="175" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="87" y="23" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">🧠 大腦手腳分離模式</text>

      <rect x="190" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="280" y="23" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">⚡ L1–L4 階梯式分流</text>

      <rect x="385" width="175" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="472" y="23" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">💾 Prefix 快取降本 90%</text>
    </g>

    <!-- Footer Brand -->
    <g transform="translate(0, 344)">
      <line x1="0" y1="0" x2="540" y2="0" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text y="28" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">
        FREEWINGBIZ · CHARLES AI WORKSPACE | 2026 AGENT 架構實戰指南
      </text>
    </g>
  </g>

  <!-- Right Visual: Director Brain + Subagent Workers -->
  <g transform="translate(640, 74)">
    <rect width="272" height="352" rx="18" fill="rgba(15,23,42,0.88)" stroke="#6366F1" stroke-width="2"/>
    <rect width="272" height="10" rx="5" fill="#6366F1"/>

    <!-- Top Badge -->
    <rect x="46" y="22" width="180" height="24" rx="12" fill="#0F172A" stroke="#818CF8" stroke-width="1.2"/>
    <text x="136" y="38" fill="#C7D2FE" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">ORCHESTRATION HUB</text>

    <!-- Director Brain Box -->
    <rect x="36" y="60" width="200" height="72" rx="12" fill="#312E81" stroke="#818CF8" stroke-width="1.8"/>
    <text x="136" y="88" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">👑 Director Brain (L4)</text>
    <text x="136" y="109" fill="#A5B4FC" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">只管決策拆解 · Context 保持潔淨</text>
    <text x="136" y="124" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">Cached Prefix: -90% Cost</text>

    <!-- Connecting Lines -->
    <line x1="76" y1="132" x2="64" y2="178" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrow04)"/>
    <line x1="136" y1="132" x2="136" y2="178" stroke="#10B981" stroke-width="1.8" marker-end="url(#arrow04)"/>
    <line x1="196" y1="132" x2="208" y2="178" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrow04)"/>

    <!-- 3 Worker Nodes -->
    <rect x="18" y="186" width="74" height="84" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="55" y="210" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">QA 巡檢</text>
    <text x="55" y="230" fill="#94A3B8" font-family="monospace" font-size="9.5" text-anchor="middle">L1 Lite</text>
    <text x="55" y="252" fill="#34D399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">$0.075/M</text>

    <rect x="99" y="186" width="74" height="84" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.4"/>
    <text x="136" y="210" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">撰寫編碼</text>
    <text x="136" y="230" fill="#94A3B8" font-family="monospace" font-size="9.5" text-anchor="middle">L2 Flash</text>
    <text x="136" y="252" fill="#34D399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">$0.15/M</text>

    <rect x="180" y="186" width="74" height="84" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="217" y="210" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">架構審查</text>
    <text x="217" y="230" fill="#94A3B8" font-family="monospace" font-size="9.5" text-anchor="middle">L3/L4 Pro</text>
    <text x="217" y="252" fill="#FDE68A" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">On-Demand</text>

    <!-- Return Contract Pill -->
    <rect x="24" y="290" width="224" height="44" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.4"/>
    <text x="136" y="309" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">📦 Return Contract：只回傳 150 字摘要</text>
    <text x="136" y="325" fill="#A7F3D0" font-family="monospace" font-size="10" text-anchor="middle">20KB Raw Logs 留在子代理沙盒內</text>
  </g>
</svg>
