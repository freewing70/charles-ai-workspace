<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="auto">
  <defs>
    <linearGradient id="rules-cover-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>

    <pattern id="rules-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(167,139,250,0.06)" stroke-width="1"/>
    </pattern>

    <radialGradient id="rules-glow" cx="78%" cy="32%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#rules-cover-bg)"/>
  <rect width="960" height="500" fill="url(#rules-grid)"/>
  <circle cx="750" cy="175" r="280" fill="url(#rules-glow)"/>

  <!-- Left Content Column -->
  <g transform="translate(60, 58)">
    <rect width="265" height="30" rx="15" fill="rgba(139,92,246,0.16)" stroke="#A78BFA" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="5" fill="#A78BFA"/>
    <text x="30" y="20" fill="#DDD6FE" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">VIBE CODING · RULES ENGINE</text>

    <text y="78" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="-0.5">
      AI IDE 系統規則工程實戰
    </text>
    <text y="122" fill="#C4B5FD" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">
      .cursorrules 與 AGENTS.md 零幻覺開發憲法
    </text>

    <text y="165" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="400">
      專案超過十個檔案，AI 就開始失憶、亂改架構、偷裝套件？
    </text>
    <text y="190" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="600">
      用分域 .mdc 規則、5 層架構憲法與驗證閘門，鎖死 Cursor / Windsurf / Claude Code。
    </text>

    <!-- Key Takeaway Pills -->
    <g transform="translate(0, 232)">
      <rect width="180" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="90" y="23" fill="#C4B5FD" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">📂 Glob 分域規則架構</text>

      <rect x="195" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="285" y="23" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">⚖️ 五層開發憲法</text>

      <rect x="390" width="185" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="482" y="23" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">🛡️ 跨 IDE 統一實戰模板</text>
    </g>

    <g transform="translate(0, 342)">
      <line x1="0" y1="0" x2="540" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text y="28" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">
        FREEWINGBIZ · CHARLES AI WORKSPACE | 2026 實戰系列教學
      </text>
    </g>
  </g>

  <!-- Right Visual: 5-Layer Rule Stack -->
  <g transform="translate(652, 88)">
    <rect width="248" height="330" rx="16" fill="rgba(15,23,42,0.88)" stroke="#A78BFA" stroke-width="2"/>
    <rect width="248" height="10" rx="5" fill="#A78BFA"/>

    <rect x="44" y="22" width="160" height="24" rx="12" fill="#0F172A" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="124" y="38" fill="#DDD6FE" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">5-LAYER CONSTITUTION</text>

    <!-- Stack Layers -->
    <rect x="20" y="60" width="208" height="40" rx="8" fill="#1E1B4B" stroke="#6366F1"/>
    <text x="32" y="84" fill="#E0E7FF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">L1 · Tech Stack Lock（技術鎖定）</text>

    <rect x="20" y="108" width="208" height="40" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="32" y="132" fill="#DBEAFE" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">L2 · Directory Boundaries（邊界）</text>

    <rect x="20" y="156" width="208" height="40" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="32" y="180" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">L3 · Anti-Patterns（禁止黑名單）</text>

    <rect x="20" y="204" width="208" height="40" rx="8" fill="#451A03" stroke="#F59E0B"/>
    <text x="32" y="228" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">L4 · Verification（自動試車指令）</text>

    <rect x="20" y="252" width="208" height="40" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="32" y="276" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">L5 · Git &amp; Release Gate（發布鎖）</text>

    <text x="124" y="314" fill="#94A3B8" font-family="monospace" font-size="10.5" text-anchor="middle">AGENTS.md · CLAUDE.md · .mdc</text>
  </g>
</svg>
