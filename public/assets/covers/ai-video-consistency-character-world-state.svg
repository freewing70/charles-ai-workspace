<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="auto">
  <defs>
    <linearGradient id="cover06-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <pattern id="grid06" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(245,158,11,0.06)" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow06" cx="78%" cy="35%" r="52%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#cover06-bg)"/>
  <rect width="960" height="500" fill="url(#grid06)"/>
  <circle cx="750" cy="180" r="285" fill="url(#glow06)"/>

  <!-- Left Column -->
  <g transform="translate(56, 56)">
    <rect width="335" height="30" rx="15" fill="rgba(245,158,11,0.16)" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="16" cy="15" r="5" fill="#FBBF24"/>
    <text x="30" y="20" fill="#FDE68A" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.3">AI CINEMATOGRAPHY · CONTINUITY</text>

    <text y="78" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="33" font-weight="900" letter-spacing="-0.5">
      AI 影視連戲與角色鎖定工程
    </text>

    <text y="122" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">
      跨鏡頭光影、服裝狀態與 GEO Blocking 控制方法論
    </text>

    <text y="166" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="400">
      為什麼大多數 AI 短片過了第 3 顆鏡頭就換臉、傷口消失、左右越軸穿幫？
    </text>
    <text y="191" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="600">
      將「不可變角色錨點」與「動態 World State JSON」分離，搭配尾幀接首幀拍出電影級連戲！
    </text>

    <!-- Pills -->
    <g transform="translate(0, 232)">
      <rect width="178" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="89" y="23" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">🎭 角色三視圖錨點鎖定</text>

      <rect x="192" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="282" y="23" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">📐 GEO Blocking &amp; 180° 軸線</text>

      <rect x="386" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="476" y="23" fill="#A78BFA" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">🎞️ 尾幀接首幀跨引擎串流</text>
    </g>

    <g transform="translate(0, 344)">
      <line x1="0" y1="0" x2="540" y2="0" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text y="28" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">
        FREEWINGBIZ · CHARLES AI WORKSPACE | 2026 AI 影視工業化實戰
      </text>
    </g>
  </g>

  <!-- Right Visual: Character Anchor + World State + 180 Axis -->
  <g transform="translate(642, 74)">
    <rect width="270" height="352" rx="18" fill="rgba(15,23,42,0.88)" stroke="#F59E0B" stroke-width="2"/>
    <rect width="270" height="10" rx="5" fill="#F59E0B"/>

    <rect x="44" y="24" width="182" height="24" rx="12" fill="#0F172A" stroke="#FBBF24" stroke-width="1.2"/>
    <text x="135" y="40" fill="#FDE68A" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">CONTINUITY COMPILER</text>

    <!-- Immutable Identity -->
    <rect x="20" y="64" width="230" height="72" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="32" y="86" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800">🔒 Immutable Character Sheet</text>
    <text x="32" y="106" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10.5">Front / Profile / 45° Turnaround</text>
    <text x="32" y="123" fill="#7DD3FC" font-family="monospace" font-size="10">Seed + Face Lock + Silhouette</text>

    <!-- Mutable World State -->
    <rect x="20" y="150" width="230" height="92" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="32" y="172" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800">🔄 Dynamic World State JSON</text>
    <text x="32" y="192" fill="#E2E8F0" font-family="monospace" font-size="10">wetness: 0.75 (rain_soaked)</text>
    <text x="32" y="209" fill="#E2E8F0" font-family="monospace" font-size="10">injury: "left_cheek_cut"</text>
    <text x="32" y="226" fill="#E2E8F0" font-family="monospace" font-size="10">prop_R: "silver_lighter_lit"</text>

    <!-- GEO Blocking Diagram Mini -->
    <rect x="20" y="256" width="230" height="78" rx="10" fill="#1E1B4B" stroke="#A78BFA" stroke-width="1.4"/>
    <text x="135" y="276" fill="#DDD6FE" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">📐 GEO Blocking &amp; 180° Axis</text>
    <line x1="40" y1="302" x2="230" y2="302" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="70" cy="302" r="7" fill="#38BDF8"/>
    <circle cx="200" cy="302" r="7" fill="#EC4899"/>
    <text x="70" y="322" fill="#7DD3FC" font-family="monospace" font-size="9.5" text-anchor="middle">Actor A (L)</text>
    <text x="135" y="296" fill="#FDE68A" font-family="monospace" font-size="9" text-anchor="middle">180° Line</text>
    <text x="200" y="322" fill="#F9A8D4" font-family="monospace" font-size="9.5" text-anchor="middle">Actor B (R)</text>
  </g>
</svg>
