<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="auto">
  <defs>
    <linearGradient id="cover-bg-09" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <pattern id="grid-09" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16,185,129,0.06)" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow-09" cx="80%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#cover-bg-09)"/>
  <rect width="960" height="500" fill="url(#grid-09)"/>
  <circle cx="755" cy="190" r="290" fill="url(#glow-09)"/>

  <!-- Left Content Column -->
  <g transform="translate(60, 60)">
    <rect width="275" height="30" rx="15" fill="rgba(16,185,129,0.16)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="5" fill="#10B981"/>
    <text x="30" y="20" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">VIBE CODING · E2E SELF-VERIFICATION</text>

    <text y="78" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="33" font-weight="900" letter-spacing="-0.5">
      給 Vibe Coder 的自動化驗收神盾
    </text>

    <text y="122" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">
      用 Playwright MCP 讓 AI 寫完網頁自己開瀏覽器跑測試
    </text>

    <text y="166" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="400">
      受夠 AI 自信喊出「Done!」，點開網頁卻滿屏 Console Error、按鈕無反應、手機版破版？
    </text>
    <text y="192" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="600">
      打通 Playwright / Chrome DevTools MCP 閉環，打造 5 步驟視覺與無障礙自動自癒管線！
    </text>

    <!-- Key Takeaway Pills -->
    <g transform="translate(0, 232)">
      <rect width="176" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="88" y="23" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🎭 Playwright MCP 閉環</text>

      <rect x="190" width="184" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="282" y="23" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🌳 Accessibility Tree</text>

      <rect x="388" width="184" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="480" y="23" fill="#FCD34D" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">📱 雙視口截圖 &amp; 自癒</text>
    </g>

    <g transform="translate(0, 340)">
      <line x1="0" y1="0" x2="540" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text y="28" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">
        FREEWINGBIZ · CHARLES AI WORKSPACE | 自動化品質防線實戰
      </text>
    </g>
  </g>

  <!-- Right Visual: Browser E2E Verification Loop -->
  <g transform="translate(650, 95)">
    <rect width="250" height="315" rx="16" fill="rgba(15,23,42,0.9)" stroke="#10B981" stroke-width="2"/>
    <rect width="250" height="28" rx="12" fill="#1E293B"/>
    <circle cx="20" cy="14" r="4.5" fill="#EF4444"/>
    <circle cx="35" cy="14" r="4.5" fill="#F59E0B"/>
    <circle cx="50" cy="14" r="4.5" fill="#10B981"/>
    <text x="145" y="18" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">localhost:4321 · E2E</text>

    <!-- Step Cards -->
    <rect x="22" y="45" width="206" height="40" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="125" y="69" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">1. 啟動 Server &amp; 捕捉 Console 錯誤</text>

    <rect x="22" y="96" width="206" height="40" rx="8" fill="#0F172A" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="125" y="120" fill="#C4B5FD" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">2. 讀取 A11y 語意樹定位元件</text>

    <rect x="22" y="147" width="206" height="40" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="125" y="171" fill="#FCD34D" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">3. 375px / 1440px 視覺截圖比對</text>

    <rect x="22" y="198" width="206" height="40" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="125" y="222" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">4. 失敗自動修復並重跑回歸測試</text>

    <!-- Pass Badge -->
    <rect x="35" y="258" width="180" height="36" rx="18" fill="#10B981"/>
    <text x="125" y="281" fill="#022C22" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="900" text-anchor="middle">✅ 0 ERRORS · PASS</text>
  </g>
</svg>