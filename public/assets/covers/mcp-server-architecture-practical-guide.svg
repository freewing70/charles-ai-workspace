<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="auto">
  <defs>
    <linearGradient id="mcp-cover-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0C2A4D"/>
    </linearGradient>

    <pattern id="mcp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56,189,248,0.06)" stroke-width="1"/>
    </pattern>

    <radialGradient id="mcp-glow" cx="78%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#mcp-cover-bg)"/>
  <rect width="960" height="500" fill="url(#mcp-grid)"/>
  <circle cx="750" cy="180" r="280" fill="url(#mcp-glow)"/>

  <!-- Left Content Column -->
  <g transform="translate(60, 58)">
    <rect width="265" height="30" rx="15" fill="rgba(56,189,248,0.14)" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="5" fill="#38BDF8"/>
    <text x="30" y="20" fill="#7DD3FC" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">AGENT ENGINEERING · MCP</text>

    <text y="78" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="33" font-weight="900" letter-spacing="-0.5">
      Model Context Protocol 實戰
    </text>
    <text y="122" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">
      打造 Claude &amp; Cursor 通用的本地資料庫伺服器
    </text>

    <text y="165" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="400">
      別再為每個模型重寫客製化 Function Calling 膠水程式碼！
    </text>
    <text y="190" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="600">
      從 JSON-RPC 三層架構、stdio vs Streamable HTTP，到 TypeScript 唯讀安全實作。
    </text>

    <!-- Key Takeaway Pills -->
    <g transform="translate(0, 232)">
      <rect width="175" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="87" y="23" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">🔌 AI 界的 USB-C</text>

      <rect x="190" width="185" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="282" y="23" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">🧱 Tools &amp; Resources</text>

      <rect x="390" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
      <text x="480" y="23" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">🛡️ 唯讀防注入沙盒</text>
    </g>

    <g transform="translate(0, 342)">
      <line x1="0" y1="0" x2="540" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text y="28" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">
        FREEWINGBIZ · CHARLES AI WORKSPACE | 2026 實戰系列教學
      </text>
    </g>
  </g>

  <!-- Right Visual: USB-C Hub Connecting Host -> MCP -> DB -->
  <g transform="translate(650, 88)">
    <rect width="250" height="330" rx="16" fill="rgba(15,23,42,0.88)" stroke="#38BDF8" stroke-width="2"/>
    <rect width="250" height="10" rx="5" fill="#38BDF8"/>

    <!-- Top Badge -->
    <rect x="40" y="22" width="170" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="125" y="38" fill="#7DD3FC" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">JSON-RPC 2.0 BUS</text>

    <!-- Host Nodes -->
    <rect x="22" y="64" width="95" height="44" rx="8" fill="#1E293B" stroke="#64748B"/>
    <text x="69" y="84" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Claude</text>
    <text x="69" y="99" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">MCP Host</text>

    <rect x="133" y="64" width="95" height="44" rx="8" fill="#1E293B" stroke="#64748B"/>
    <text x="180" y="84" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Cursor</text>
    <text x="180" y="99" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">MCP Host</text>

    <!-- Connecting Lines to Central MCP Hub -->
    <line x1="69" y1="108" x2="125" y2="144" stroke="#38BDF8" stroke-width="2"/>
    <line x1="180" y1="108" x2="125" y2="144" stroke="#38BDF8" stroke-width="2"/>

    <!-- Central MCP Protocol Box -->
    <rect x="35" y="144" width="180" height="62" rx="10" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
    <text x="125" y="170" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle">🔌 MCP Server</text>
    <text x="125" y="191" fill="#BAE6FD" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">stdio / Streamable HTTP</text>

    <!-- Line down to DB -->
    <line x1="125" y1="206" x2="125" y2="236" stroke="#10B981" stroke-width="2"/>

    <!-- Read-only DB Box -->
    <rect x="28" y="236" width="194" height="72" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="125" y="260" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">🗄️ SQLite / PostgreSQL</text>
    <text x="125" y="280" fill="#A7F3D0" font-family="monospace" font-size="10.5" text-anchor="middle">READ-ONLY + ZOD GUARD</text>
    <text x="125" y="297" fill="#34D399" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">✓ 防注入 · 零越權 · 標準化</text>
  </g>
</svg>
